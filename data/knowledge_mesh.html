i, situa-se no domínio disciplinar da Ciência Política e da Administração Pública, com foco específico na análise de políticas públicas e *policy design*. A obra investiga a eficácia e a operacionalização de intervenções governamentais através da distinção e articulação entre mecanismos de primeira ordem (instrumentos substantivos e diretos de regulação e alocação de recursos) e de segunda ordem (mecanismos processuais e metapolíticas voltados à calibragem, adaptação e governança dos próprios instrumentos). \n\nMetodologicamente, o estudo desenvolve um arcabouço analítico voltado à identificação das falhas de implementação decorrentes do desalinhamento entre o desenho institucional e a dinâmica operacional dos instrumentos escolhidos. Os conceitos-chave estruturam-se em torno da arquitetura de políticas, causalidade em *policy design*, capacidade estatal, calibragem instrumental e mecanismos de feedback regulatório. A obra contribui para a literatura teórica ao fornecer taxonomia rigorosa para avaliar por que determinadas políticas falham enquanto outras alcançam seus objetivos pretendidos, mapeando as condições estruturais e processuais que determinam o sucesso ou o fracasso de intervenções públicas complexas.", "full_text": "A monografia *Making policies work: first- and second-order mechanisms in policy design*, publicada em 2019 por Giliberto Capano, Michael Howlett, M. Ramesh e Altaf Virani, situa-se no domínio disciplinar da Ciência Política e da Administração Pública, com foco específico na análise de políticas públicas e *policy design*. A obra investiga a eficácia e a operacionalização de intervenções governamentais através da distinção e articulação entre mecanismos de primeira ordem (instrumentos substantivos e diretos de regulação e alocação de recursos) e de segunda ordem (mecanismos processuais e metapolíticas voltados à calibragem, adaptação e governança dos próprios instrumentos). \n\nMetodologicamente, o estudo desenvolve um arcabouço analítico volt rns*) e sequências. Metodologicamente, a abordagem afasta-se da análise puramente formal ou morfológica dos edifícios para examinar a arquitetura e o urbanismo como tecnologias ativas de governança, gestão de fluxos globais e modulação do comportamento socioespacial contemporâneo.", "full_text": "*Extrastatecraft: the power of infrastructure space* (2014), de Keller Easterling, constitui uma monografia teórica e crítica situada na interface entre a arquitetura, o urbanismo, os estudos de infraestrutura e a geografia política. O objeto central de investigação é o \"espaço de infraestrutura\" (*infrastructure space*) — compreendido não apenas como suporte físico, mas como um sistema ativo de regras, repetições, zoneamentos e tecnologias de gestão global que opera paralelamente ou em substituição aos estados-nação tradicionais. A obra examina a infraestrutura como um vetor de poder extratestatal (*extrastatecraft*), desdobrando conceitos-chave como agenciamento espacial, matrizes normativas, urbanismo de redes, dispositivos logísticos e a instrumentalização espacial de padrões (*patterns*) e sequências. Metodologicamente, a abordagem afasta-se da análise puramente formal ou morfológica dos edifícios para examinar a arquitetura e o urbanismo como tecnologias ativas de governança, gestão de fluxos globais e modulação do comportamento socioespacial contemporâneo.", "location": "2014-01-01", "cluster_id": 5, "cluster_name": "Constelação: Sociologia / Estado / Monografia", "color": "#684E72", "size": 18, "_centrality": 0.22863672496025436, "_target_radius": 182.04456162162163, "x3": 121.12027527376738, "y3": -65.90060172561242, "z3": -118.85794893829113}, {"id": "work_7", "type": "work", "entity_type": "work", "entity_id": 7, "title": "Segurança, território, população", "work_title": "Segurança, território, população", "label": "Segurança, território, população", "author": "Foucault, Michel", "doc_type": "EditorialMonograph", "fragment_count": 0, "excerpt": "Monografia editorial resultante do curso ministrado por Michel Foucault no Collège de France entre 1977 e 1978, inserida no domínio da filosofia política, da história dos sistemas de pensamento e da sociologia histórica. A obra investiga a gênese e a transformação das técnicas de poder na modernidade ocidental, tendo como objeto central a emergência da \"biopolítica\" e a articulação entre as tecnologias disciplinares centradas no corpo individual e os mecanismos regulatórios voltados à população como fenômeno biológico global. \n\nA abordagem metodológica fundamenta-se na arqueologia e na genealogia do poder, mobilizando conceitos-chave como \"governamentalidade\", \"dispositivo de segurança\", \"razão de Estado\", \"contranatureza\" e a transição histórica dos regimes de soberania para o liberalismo e o neoliberalismo. O eixo analítico examina como o território, historicamente gerido pela soberania jurídica e pela disciplina espacial, passa a ser reconfigurado analógica e politicamente pela gestão estatística da população, consolidando a segurança não apenas como aparato repressivo, mas como tecnologia governamental intrínseca à modulação dos processos biológicos, econômicos e demográficos.", "full_text": "Monografia editorial resultante do curso ministrado por Michel Foucault no Collège de France entre 1977 e 1978, inserida no domínio da filosofia política, da história dos sistemas de pensamento e da sociologia histórica. A obra investiga a gênese e a transformação das técnicas de poder na modernidade ocidental, tendo como objeto central a emergência da \"biopolítica\" e a articulação entre as tecnologias disciplinares centradas no corpo individual e os mecanismos regulatórios voltados à população como fenômeno biológico global. \n\nA abordagem metodológica fundamenta-se na arqueologia e na genealogia do poder, mobilizando conceitos-chave como \"governamentalidade\", \"dispositivo de segurança\", \"razão de Estado\", \"contranatureza\" e a transição histórica dos regimes de soberania para o liberalismo e o neoliberalismo. O eixo analítico examina como o território, historicamente gerido pela soberania jurídica e pela disciplina espacial, passa a ser reconfigurado analógica e politicamente pela gestão estatística da população, consolidando a segurança não apenas como aparato repressivo, mas como tecnologia governamental intrínseca à modulação dos processos biológicos, econômicos e demográficos.", "location": "2008-01-01", "cluster_id": 5, "cluster_name": "Constelação: Sociologia / Estado / Monografia", "color": "#684E72", "size": 18, "_centrality": 0.26196343402225764, "_target_radius": 177.80709989189188, "x3": 92.37727198964888, "y3": -88.07673622018142, "z3": -123.79132816363281}, {"id": "work_8", "type": "work", "entity_type": "work", "entity_id": 8, "title": "Vigiar e punir", "work_title": "Vigiar e punir", "label": "Vigiar e punir", "author": "Foucault, Michel", "doc_type": "EditorialMonograph", "fragment_count": 0, "excerpt": "Monografia histórico-genealógica no domínio da filosofia política, da sociologia do poder e da história das instituições, dedicada à investigação das transformações punitivas na sociedade ocidental moderna. O objeto central de estudo recai sobre a gênese e a reconfiguração das técnicas de controle social e da penalidade, mapeando a transição estrutural do suplício corporal espetacular — caracterizado pelo exercício soberano e violento sobre o corpo do condenado — para a economia política da punição centrada na alma, na coerção disciplinar e no encarceramento. \n\nO recorte temático problematiza a emergência da prisão moderna como dispositivo de ajustamento, domesticação e normalização dos indivíduos, articulando categorias analíticas fundamentais como poder disciplinar, vigilância hierárquica, exame, panoptismo e a correlação saber-poder na gestão biopolítica da força de trabalho. A abordagem metodológica recusa a teleologia progressista do direito penal,", "full_text": "Monografia histórico-genealógica no domínio da filosofia política, da sociologia do poder e da história das instituições, dedicada à investigação das transformações punitivas na sociedade ocidental moderna. O objeto central de estudo recai sobre a gênese e a reconfiguração das técnicas de controle social e da penalidade, mapeando a transição estrutural do suplício corporal espetacular — caracterizado pelo exercício soberano e violento sobre o corpo do condenado — para a economia política da punição centrada na alma, na coerção disciplinar e no encarceramento. \n\nO recorte temático problematiza a emergência da prisão moderna como dispositivo de ajustamento, domesticação e normalização dos indivíduos, articulando categorias analíticas fundamentais como poder disciplinar, vigilância hierárquica, exame, panoptismo e a correlação saber-poder na gestão biopolítica da força de trabalho. A abordagem metodológica recusa a teleologia progressista do direito penal,", "location": "2014-01-01", "cluster_id": 1, "cluster_name": "Constelação: Econômica / Constitucional / Monografia", "color": "#7A5C00", "size": 18, "_centrality": 0.22682829888712247, "_target_radius": 182.2745014054054, "x3": -124.4677857592866, "y3": 50.136634500972654, "z3": -123.36159066616054}, {"id": "work_9", "type": "work", "entity_type": "work", "entity_id": 9, "title": "A cultura do controle", "work_title": "A cultura do controle", "label": "A cultura do controle", "author": "Garland, David", "doc_type": "EditorialMonograph", "fragment_count": 0, "excerpt": "Monografia de sociologia jurídica e criminologia crítica que investiga a transformação estrutural das políticas de segurança e das respostas institucionais ao delito nas sociedades ocidentais avançadas do final do século XX e início do século XXI. O objeto central de estudo consiste na emergência de uma \"cultura do controle\", caracterizada pela rutura com o modelo penal welfarista e pela consolidação de estratégias punitivas baseadas na gestão atuarial do risco, na hipertrofia do sistema penitenciário, na espetacularização da justiça criminal e na mercantilização da segurança. A abordagem metodológica articula a macro-sociologia histórica com a análise institucional, mapeando as mudanças nas sensibilidades culturais e nas práticas governamentais face ao crime.\n\nOs conceitos-chave estruturantes da obra incluem a normalização da alta taxa de criminalidade, a criminologia do outro — que polariza o tratamento penal em detrimento da reinserção social —, a recriação do Estado penal em detrimento do Estado social, o declínio do ideal reabilitador e a proliferação de mecanismos preventivos de vigilância situacional no espaço urbano. O texto delimita o fenômeno contemporâneo em que o crime deixa de ser tratado prioritariamente como um problema social decorrente de déficits estruturais para ser redefinido como um risco permanente inerente à modernidade tardia, exigindo respostas gerenciais de neutralização e incapacitação dos ofensores.", "full_text": "Monografia de sociologia jurídica e criminologia crítica que investiga a transformação estrutural das políticas de segurança e das respostas institucionais ao delito nas sociedades ocidentais avançadas do final do século XX e início do século XXI. O objeto central de estudo consiste na emergência de uma \"cultura do controle\", caracterizada pela rutura com o modelo penal welfarista e pela consolidação de estratégias punitivas baseadas na gestão atuarial do risco, na hipertrofia do sistema penitenciário, na espetacularização da justiça criminal e na mercantilização da segurança. A abordagem metodológica articula a macro-sociologia histórica com a análise institucional, mapeando as mudanças nas sensibilidades culturais e nas práticas governamentais face ao crime.\n\nOs conceitos-chave estruturantes da obra incluem a normalização da alta taxa de criminalidade, a criminologia do outro — que polariza o tratamento penal em detrimento da reinserção social —, a recriação do Estado penal em detrimento do Estado social, o declínio do ideal reabilitador e a proliferação de mecanismos preventivos de vigilância situacional no espaço urbano. O texto delimita o fenômeno contemporâneo em que o crime deixa de ser tratado prioritariamente como um problema social decorrente de déficits estruturais para ser redefinido como um risco permanente inerente à modernidade tardia, exigindo respostas gerenciais de neutralização e incapacitação dos ofensores.", "location": "2008-01-01", "cluster_id": 5, "cluster_name": "Constelação: Sociologia / Estado / Monografia", "color": "#684E72", "size": 18, "_centrality": 0.39940381558028626, "_target_radius": 160.33167632432432, "x3": 65.9186749843226, "y3": -65.52254901581047, "z3": -130.64367681502938}, {"id": "work_10", "type": "work", "entity_type": "work", "entity_id": 10, "title": "Cities under siege", "work_title": "Cities under siege", "label": "Cities under siege", "author": "Graham, Stephen", "doc_type": "EditorialMonograph", "fragment_count": 0, "excerpt": "Monografia acadêmica de caráter crítico e interdisciplinar situada na interseção entre os estudos urbanos, a geografia política e a sociologia militar, centrada na análise da convergência entre a segurança nacional, as operações bélicas contemporâneas e a gestão do espaço urbano global. A obra examina o fenômeno do \"novo urbanismo militar\", investigando a transmutação das cidades em teatros de operações, zonas de fronteira internalizadas e alvos estratégicos de doutrinas de contrainsurgência e controle populacional. \n\nUtilizando uma abordagem analítica transversal a partir de conceitos-chave como militarização da vida cotidiana, securitização do espaço público, vigilância assimétrica, apartheid socioespacial e necropolítica urbana, o texto desdobra os mecanismos sistêmicos pelos quais tecnologias de guerra e táticas de ocupação colonial são aplicadas na governança e na arquitetura das metrópoles contemporâneas, evidenciando a erosão das fronteiras entre os conceitos de guerra exterior e policiamento interno.", "full_text": "Monografia acadêmica de caráter crítico e interdisciplinar situada na interseção entre os estudos urbanos, a geografia política e a sociologia militar, centrada na análise da convergência entre a segurança nacional, as operações bélicas contemporâneas e a gestão do espaço urbano global. A obra examina o fenômeno do \"novo urbanismo militar\", investigando a transmutação das cidades em teatros de operações, zonas de fronteira internalizadas e alvos estratégicos de doutrinas de contrainsurgência e controle populacional. \n\nUtilizando uma abordagem analítica transversal a partir de conceitos-chave como militarização da vida cotidiana, securitização do espaço público, vigilância assimétrica, apartheid socioespacial e necropolítica urbana, o texto desdobra os mecanismos sistêmicos pelos quais tecnologias de guerra e táticas de ocupação colonial são aplicadas na governança e na arquitetura das metrópoles contemporâneas, evidenciando a erosão das fronteiras entre os conceitos de guerra exterior e policiamento interno.", "location": "2010-01-01", "cluster_id": 1, "cluster_name": "Constelação: Econômica / Constitucional / Monografia", "color": "#7A5C00", "size": 18, "_centrality": 0.34282591414944363, "_target_radius": 167.5255067027027, "x3": -122.14779706656026, "y3": 68.24899503583188, "z3": -92.12375233555508}, {"id": "work_11", "type": "work", "entity_type": "work", "entity_id": 11, "title": "Policy feedback theory", "work_title": "Policy feedback theory", "label": "Policy feedback theory", "author": "Mettler, Suzanne, Sorelle, Mallory", "doc_type": "EditorialMonograph", "fragment_count": 0, "excerpt": "A obra *Policy feedback theory* (2018), de Suzanne Mettler e Mallory Sorelle, insere-se no domínio disciplinar da ciência política e da administração pública, constituindo uma sistematização teórica e analítica da abordagem de *feedback* de políticas públicas. O objeto central de estudo examina os mecanismos causais por meio dos quais políticas públicas já implementadas operam como variáveis independentes que transformam o ambiente político, moldando o comportamento do Estado, a estruturação de grupos de interesse e a mobilização do eleitorado e dos cidadãos. \n\nA investigação conceitual desdobra-se em torno dos eixos de efeitos interpretativos e efeitos de recursos, mapeando como o desenho institucional e os incentivos gerados por legislações prévias afetam a distribuição de poder e a subsequente dinâmica de retroalimentação no ciclo de políticas públicas. A abordagem metodológica articula premissas do neo-institucionalismo histórico com a análise de economia política e comportamento político, fornecendo um arcabouço conceitual robusto voltado à recuperação de informação sobre os impactos dinâmicos do Estado sobre a sociedade e sobre a própria estabilidade e transformação das políticas estatais.", "full_text": "A obra *Policy feedback theory* (2018), de Suzanne Mettler e Mallory Sorelle, insere-se no domínio disciplinar da ciência política e da administração pública, constituindo uma sistematização teórica e analítica da abordagem de *feedback* de políticas públicas. O objeto central de estudo examina os mecanismos causais por meio dos quais políticas públicas já implementadas operam como variáveis independentes que transformam o ambiente político, moldando o comportamento do Estado, a estruturação de grupos de interesse e a mobilização do eleitorado e dos cidadãos. \n\nA investigação conceitual desdobra-se em torno dos eixos de efeitos interpretativos e efeitos de recursos, mapeando como o desenho institucional e os incentivos gerados por legislações prévias afetam a distribuição de poder e a subsequente dinâmica de retroalimentação no ciclo de políticas públicas. A abordagem metodológica articula premissas do neo-institucionalismo histórico com a análise de economia política e comportamento político, fornecendo um arcabouço conceitual robusto voltado à recuperação de informação sobre os impactos dinâmicos do Estado sobre a sociedade e sobre a própria estabilidade e transformação das políticas estatais.", "location": "2018-01-01", "cluster_id": 4, "cluster_name": "Constelação: Políticas / Causais / Policy", "color": "#3E6657", "size": 18, "_centrality": 0.65, "_target_radius": 128.468592, "x3": 83.45196935328276, "y3": 96.47133037426568, "z3": -15.271881263960484}, {"id": "work_12", "type": "work", "entity_type": "work", "entity_id": 12, "title": "To save everything, click here", "work_title": "To save everything, click here", "label": "To save everything, click here", "author": "Morozov, Evgeny", "doc_type": "EditorialMonograph", "fragment_count": 0, "excerpt": "Monografia editorial situada na intersecção entre os estudos de ciência, tecnologia e sociedade (CST), a sociologia digital e a economia política da internet. O objeto central de estudo consiste na crítica epistemológica e normativa ao \"solucionismo tecnológico\" e à \"internet-centridade\", compreendidos como a tendência ideológica contemporânea de reduzir problemas sociais, políticos, urbanos e morais complexos a meras falhas de engenharia otimizáveis por meio de aplicativos, algoritmos, plataformização e coleta massiva de dados. A abordagem metodológica pauta-se na análise crítica do discurso tecnopolítico e na desconstrução de narrativas hegemônicas promovidas por corporações do Vale do Silício, elites acadêmicas e tecnocratas digitais. Os conceitos-chave articulados ao longo da obra englobam o solucionismo, o reducionismo informacional, a instrumentalização da vida cotidiana, a gamificação da cidadania e a mercantilização da deliberação pública sob a égide da eficiência computacional e do eficientismo gerencial.", "full_text": "Monografia editorial situada na intersecção entre os estudos de ciência, tecnologia e sociedade (CST), a sociologia digital e a economia política da internet. O objeto central de estudo consiste na crítica epistemológica e normativa ao \"solucionismo tecnológico     const clusterRadius = Math.min(width, height) * 0.36;

    // Drag handlers
    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    function triggerPhysicsRestart() {
      simulation.alpha(1).restart();
    }

    // Selection & Highlighting
    node.on("click", (event, d) => {
      event.stopPropagation();
      selectNode(d);
    });

    svg.on("click", () => {
      clearHighlight();
      closeCard();
    });

    function selectNode(d) {
      // Highlight neighbors
      const connectedNodeIds = new Set();
      connectedNodeIds.add(d.id);

      links.forEach(l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        if (sId === d.id) connectedNodeIds.add(tId);
        if (tId === d.id) connectedNodeIds.add(sId);
      });

      node.classed("dimmed", n => !connectedNodeIds.has(n.id));
      link.classed("highlighted", l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        return sId === d.id || tId === d.id;
      });

      openCard(d);
    }

    function clearHighlight() {
      node.classed("dimmed", false);
      link.classed("highlighted", false);
    }

    function openCard(d) {
      const card = document.getElementById("detail-card");
      document.getElementById("card-type-badge").innerText = (d.type || "Nó").toUpperCase();
      document.getElementById("card-title").innerText = d.label || "Sem título";
      document.getElementById("card-meta").innerText = d.work_title ? ("Obra: " + d.work_title) : (d.cluster_name ? ("Cluster: " + d.cluster_name) : "");
      document.getElementById("card-excerpt").innerText = d.full_text || "Sem conteúdo textual.";

      // Populate resonances
      const resContainer = document.getElementById("card-resonances");
      resContainer.innerHTML = "";
      const connected = links
        .filter(l => {
          const sId = typeof l.source === 'object' ? l.source.id : l.source;
          const tId = typeof l.target === 'object' ? l.target.id : l.target;
          return sId === d.id || tId === d.id;
        })
        .map(l => {
          const sId = typeof l.source === 'object' ? l.source.id : l.source;
          const targetId = (sId === d.id) ? (typeof l.target === 'object' ? l.target.id : l.target) : sId;
          const targetNode = nodes.find(n => n.id === targetId);
          return { node: targetNode, weight: l.weight };
        })
        .filter(c => c.node);

      if (connected.length === 0) {
        resContainer.innerHTML = '<div style="font-size: 11px; color: #666666; padding: 6px 0;">Nenhuma ressonância detectada com os parâmetros atuais.</div>';
      } else {
        connected.forEach(c => {
          const item = document.createElement("div");
          item.className = "resonance-item";
          const pct = Math.round((c.weight || 0) * 100);
          item.innerHTML = `<strong>${c.node.label || "Nó"}</strong> (${pct}% ressonância)`;
          item.onclick = () => selectNode(c.node);
          resContainer.appendChild(item);
        });
      }

      card.classList.add("visible");
    }

    function closeCard() {
      document.getElementById("detail-card").classList.remove("visible");
    }

    // Search Box Filter
    document.getElementById("search-input").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        clearHighlight();
        return;
      }
      node.classed("dimmed", d => {
        const text = ((d.label || "") + " " + (d.full_text || "") + " " + (d.work_title || "")).toLowerCase();
        return !text.includes(query);
      });
    });
  </script>
</body>
</html>
