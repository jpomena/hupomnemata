app:
  name: 'Hupomnēmata'
  version: 'Version 0.1'
  main_view_title: 'Gabinete de Leitura'
  main_view_subtitle: 'Seu repositório pessoal de bibliografia e escrita.'
  slogan: 'O arquivo vivo das suas ideias.'

messages:
  welcome: >
   Este é o seu refúgio e espaço de rigor intelectual — um lugar criado para acolher suas leituras, 
   organizar suas referências e preservar as ideias que moldam o seu percurso.


   Pense neste aplicativo como o seu escritório particular: sem distrações, feito de papel e tinta digital, 
   onde cada citação, artigo e livro encontra seu devido lugar de guarda. Tire um momento para organizar 
   sua biblioteca, retomar anotações de velhas pesquisas ou registrar aquela descoberta recente que mudou 
   sua perspectiva.


   Sinta-se em casa. Bom trabalho e ótimas leituras.
  placeholder_citation: >
    "O movimento que eles [os hupomnēmata] procuram realizar é o inverso daquele: trata-se não de buscar o indizível, não de revelar 
    o oculto, não de dizer o não-dito, mas de captar, pelo contrário, o já dito; reunir o que se pôde ouvir ou ler, e isso 
    com uma finalidade que nada mais é que a constituição de si."

    Foucault, Michel — A escrita de si
