/* ── controls ──────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-h); padding: 0 var(--space-sm); border-radius: var(--radius-sm); border: var(--rule-w) solid var(--color-rule-2); background: var(--color-surface); color: var(--color-ink); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; transition: background var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }

.btn kbd { margin-left: 4px; background: transparent; border-color: currentColor; color: inherit; opacity: 0.55; }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 0; border-radius: var(--radius-sm); background: none; color: var(--color-ink-3); flex: none; transition: background var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }

.input, .select, .textarea { height: var(--control-h); width: 100%; padding: 0 10px; background: var(--color-canvas); color: var(--color-ink); border: var(--rule-w) solid var(--color-rule-2); border-radius: var(--radius-sm); font-size: var(--text-sm); transition: border-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out); }

.searchbox { position: relative; display: flex; align-items: center; }

.searchbox .input { padding-left: 32px; }
.cb { appearance: none; width: 16px; height: 16px; margin: 0; flex: none; border: var(--rule-w) solid var(--color-ink-3); border-radius: var(--radius-xs); background: var(--color-canvas); display: inline-grid; place-items: center; cursor: pointer; transition: background var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out); }
.cb:hover { border-color: var(--color-ink-2); }

.cb:disabled { opacity: 0.4; cursor: not-allowed; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: var(--text-sm); cursor: pointer; }
.check .cb { margin-top: 1px; }
.check small { display: block; color: var(--color-ink-3); font-size: var(--text-xs); margin-top: 1px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius-sm); background: var(--color-chrome); border: var(--rule-w) solid var(--color-rule); }
.seg button { height: 26px; padding: 0 10px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-ink-2); font-size: var(--text-sm); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }

/* ── page scaffolding (igual em todas as telas) ───── */

.tab .n { font-size: var(--text-xs); color: var(--color-ink-3); font-variant-numeric: tabular-nums; background: var(--color-hover); border-radius: var(--radius-xs); padding: 0 5px; }
.tab:hover { color: var(--color-ink); }

.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--color-accent); }
.body-pad { padding: 0 var(--space-xl) var(--space-2xl); }

/* ── início ────────────────────────────────────────── */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 var(--space-xl) var(--space-lg); overflow: hidden; }
.kpi { padding: var(--space-md); border: 0; border-right: var(--rule-w) solid var(--color-rule); display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; color: inherit; transition: background var(--dur-micro) var(--ease-out); }
.kpi:last-child { border-right: 0; }
.kpi:hover { background: var(--color-hover); }

.feed .ico .ms { font-size: 12.5px; }

.bars li button:hover { color: var(--color-ink); text-decoration: underline; text-underline-offset: 3px; }

.shortcuts button:hover { background: var(--color-hover); }

.epigraph { margin: 0; padding: 0 var(--space-xs); }

/* ── acervo: tabela + painel ──────────────────────── */

.c-text { color: var(--color-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.grid-foot { display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 var(--space-xl); border-top: var(--rule-w) solid var(--color-rule); color: var(--color-ink-3); font-size: var(--text-xs); gap: var(--space-md); flex: none; }

.frow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: var(--space-sm); padding: var(--space-sm) var(--space-sm) var(--space-sm) var(--space-md); border-bottom: var(--rule-w) solid var(--color-rule); transition: background var(--dur-micro) var(--ease-out); }

@media (hover: none) { .frow .tools { opacity: 1; } }

/* ── compilação ────────────────────────────────────── */

.idea-title .i { font-family: var(--font-ui); font-size: var(--text-sm); font-weight: 600; color: var(--color-ink-3); font-variant-numeric: tabular-nums; letter-spacing: var(--track-ui); }
.idea-central { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: var(--space-sm); padding: 10px 0; margin: 0; border-top: var(--rule-w) solid var(--color-rule); border-bottom: var(--rule-w) solid var(--color-rule); font-size: var(--text-sm); }

.fblock { border: var(--rule-w) solid var(--color-rule); border-radius: var(--radius-md); background: var(--color-surface); }

.rail { border-left: var(--rule-w) solid var(--color-rule); padding: var(--space-md); overflow: auto; display: flex; flex-direction: column; gap: var(--space-lg); background: var(--color-surface); }

.ref-list li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; font-size: var(--text-xs); line-height: 1.6; color: var(--color-ink-2); }
.ref-list li::before { counter-increment: ref; content: counter(ref) "."; color: var(--color-ink-3); font-variant-numeric: tabular-nums; }

.pw-frag { display: grid; grid-template-columns: 28px minmax(0, 1fr) 200px; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border-bottom: var(--rule-w) solid var(--color-rule); align-items: start; }
.pw-frag:last-child { border-bottom: 0; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: var(--text-xs); font-weight: 600; color: var(--color-ink-2); }

/* ── overlays ──────────────────────────────────────── */

.dialog-head { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 var(--space-sm) 0 var(--space-lg); border-bottom: var(--rule-w) solid var(--color-rule); }

.types { border-right: var(--rule-w) solid var(--color-rule); padding: var(--space-sm); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: var(--space-sm); background: var(--color-chrome); }

.form { overflow: auto; padding: var(--space-lg) var(--space-xl) var(--space-xl); display: flex; flex-direction: column; gap: var(--space-lg); }
.form-intro { display: flex; align-items: center; gap: var(--space-sm); }

.fset { border: 0; margin: 0; padding: var(--space-lg) 0 0; border-top: var(--rule-w) solid var(--color-rule); display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-lg); min-width: 0; }

.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-md); }

.dialog-foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-lg); align-items: center; padding: var(--space-sm) var(--space-sm) var(--space-sm) var(--space-lg); border-top: var(--rule-w) solid var(--color-rule); background: var(--color-chrome); }
.preview-label { font-size: var(--text-xs); font-weight: 600; color: var(--color-ink-3); margin-bottom: 2px; }
.preview-text { font-size: var(--text-sm); line-height: 1.55; color: var(--color-ink); min-height: 1.55em; }

.palette { position: fixed; inset: 0; z-index: var(--z-modal); background: var(--color-scrim); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; animation: fade var(--dur-short) var(--ease-out); }
.palette-box { width: min(620px, calc(100% - 32px)); background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); overflow: hidden; animation: pop var(--dur-short) var(--ease-out); }

.palette-results { max-height: 400px; overflow: auto; padding: 6px; }
.p-group { padding: 8px 8px 4px; font-size: var(--text-xs); font-weight: 600; color: var(--color-ink-3); }
.p-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; text-align: left; color: var(--color-ink); font-size: var(--text-sm); }

.p-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

.p-item[aria-selected="true"] { background: var(--color-selected); }

.palette-foot { display: flex; gap: var(--space-md); padding: 8px var(--space-md); border-top: var(--rule-w) solid var(--color-rule); color: var(--color-ink-3); font-size: var(--text-xs); background: var(--color-chrome); }
.palette-foot span { display: inline-flex; gap: 4px; align-items: center; }

.menu { position: fixed; z-index: var(--z-dropdown); min-width: 220px; max-width: 300px; background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-menu); padding: 4px; animation: fade var(--dur-micro) var(--ease-out); }

.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: var(--radius-xs); background: none; text-align: left; color: var(--color-ink); font-size: var(--text-sm); }
.menu-item .ms { color: var(--color-ink-3); font-size: 13px; }
.menu-item .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-item .n { color: var(--color-ink-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.menu-item:hover, .menu-item:focus-visible { background: var(--color-hover); outline: none; }
.menu-item[aria-disabled="true"] { color: var(--color-ink-3); cursor: default; }
.menu-item[aria-disabled="true"]:hover { background: none; }
.menu-item.danger, .menu-item.danger .ms { color: var(--color-danger); }
.menu-sep { height: 1px; background: var(--color-rule); margin: 4px -4px; }

.toast { position: fixed; right: var(--space-lg); bottom: var(--space-lg); z-index: var(--z-toast); display: flex; align-items: center; gap: var(--space-sm); min-height: 40px; padding: 0 6px 0 var(--space-md); background: var(--color-toast); color: var(--color-toast-ink); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; box-shadow: var(--shadow-pop); animation: toast-in var(--dur-short) var(--ease-out); }
.toast .ms { font-size: 13px; }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; padding: 6px 8px; border-radius: var(--radius-xs); display: inline-grid; place-items: center; }
.toast button:hover { background: var(--color-scrim); }
@keyframes toast-in { from { transform: translateY(6px); opacity: 0; } }

@media (max-width: 1280px) {
  .home-grid { grid-template-columns: minmax(0, 1fr); }
  .caderno { grid-template-columns: 220px minmax(0, 1fr); }
  .rail { display: none; }
  :root { --inspector-w: 340px; }
}
@media (max-width: 960px) {
  :root { --sidebar-w: 56px; }
  .wordmark { font-size: 0; }
  .wordmark::first-letter { font-size: 1.0625rem; }
  .nav-item .t, .nav-item .count, .nav-head, .search-trigger .label, .search-trigger kbd, .sb-status > span { display: none; }
  .sb-top { flex-direction: column; }
  .search-trigger { flex: none; width: 32px; height: 32px; padding: 0; justify-content: center; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(2) { border-right: 0; }
  .kpi:nth-child(-n+2) { border-bottom: var(--rule-w) solid var(--color-rule); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .inspector { position: fixed; right: 0; top: var(--titlebar-h); bottom: 0; width: min(380px, 100%); z-index: var(--z-sticky); box-shadow: var(--shadow-pop); }
  .caderno { grid-template-columns: minmax(0, 1fr); }
  .outline { display: none; }
  .page-head { flex-direction: column; align-items: flex-start; }
  .toolbar { flex-wrap: wrap; padding-top: var(--space-xs); }
  .fset { grid-template-columns: minmax(0, 1fr); }
  .dialog-body { grid-template-columns: minmax(0, 1fr); }
  .types { display: none; }
  .pw-frag { grid-template-columns: 28px minmax(0, 1fr); }
  .pw-frag .field { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 120ms !important; transition-duration: 120ms !important; }
  .dialog, .palette-box, .toast { animation-name: fade !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="tb-brand"><span class="wordmark" aria-label="Hupomnēmata">hupomnemata</span></div>
    <div class="tb-hist">
      <button class="icon-btn" data-action="back" aria-label="Voltar" title="Voltar (⌘[)"><i class="fa-solid fa-arrow-left ms" aria-hidden="true"></i></button>
      <button class="icon-btn" data-action="fwd" aria-label="Avançar" title="Avançar (⌘])"><i class="fa-solid fa-arrow-right ms" aria-hidden="true"></i></button>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Caminho"></nav>
    <div class="win" aria-hidden="true">
      <button tabindex="-1"><i class="fa-solid fa-minus ms sm" aria-hidden="true"></i></button>
      <button tabindex="-1"><i class="fa-regular fa-square ms sm" aria-hidden="true"></i></button>
      <button tabindex="-1" class="close"><i class="fa-solid fa-xmark ms sm" aria-hidden="true"></i></button>
    </div>
  </header>
  <aside class="sidebar" aria-label="Navegação principal">
    <div class="sb-top">
      <button class="search-trigger" data-action="palette"><i class="fa-solid fa-magnifying-glass ms sm" aria-hidden="true"></i><span class="label">Buscar</span><kbd>⌘K</kbd></button>
      <button class="icon-btn sq-btn" data-action="new-work" aria-label="Nova obra" title="Nova obra (⌘N)"><i class="fa-solid fa-plus ms sm" aria-hidden="true"></i></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <button class="nav-item" data-go="config" id="nav-config"><i class="fa-solid fa-gear ms" aria-hidden="true"></i><span class="t">Configurações</span></button>
      <div class="sb-status"><span><span class="dot"></span>Banco local</span><button class="icon-btn" data-action="toggle-theme" id="theme-btn" aria-label="Alternar tema"></button></div>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<div id="menu-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(() => {
const D = window.HUP_DATA;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FA = {"home": "fa-solid fa-house", "library_books": "fa-solid fa-book", "format_quote": "fa-solid fa-quote-left", "add": "fa-solid fa-plus", "folder_open": "fa-regular fa-folder-open", "hub": "fa-solid fa-diagram-project", "neurology": "fa-solid fa-brain", "settings": "fa-solid fa-gear", "search": "fa-solid fa-magnifying-glass", "light_mode": "fa-regular fa-sun", "dark_mode": "fa-regular fa-moon", "arrow_back": "fa-solid fa-arrow-left", "arrow_forward": "fa-solid fa-arrow-right", "chevron_right": "fa-solid fa-chevron-right", "remove": "fa-solid fa-minus", "crop_square": "fa-regular fa-square", "close": "fa-solid fa-xmark", "edit_note": "fa-regular fa-pen-to-square", "menu_book": "fa-solid fa-book-open", "school": "fa-solid fa-graduation-cap", "mail": "fa-regular fa-envelope", "article": "fa-regular fa-file-lines", "auto_stories": "fa-solid fa-book-open-reader", "newspaper": "fa-regular fa-newspaper", "event_note": "fa-regular fa-calendar-days", "gavel": "fa-solid fa-gavel", "account_balance": "fa-solid fa-building-columns", "lightbulb": "fa-regular fa-lightbulb", "description": "fa-regular fa-file-lines", "movie": "fa-solid fa-film", "music_note": "fa-solid fa-music", "queue_music": "fa-solid fa-music", "image": "fa-regular fa-image", "map": "fa-regular fa-map", "deployed_code": "fa-solid fa-cube", "chat_bubble": "fa-regular fa-comment", "add_notes": "fa-solid fa-file-circle-plus", "upload_file": "fa-solid fa-file-import", "ios_share": "fa-solid fa-file-export", "content_copy": "fa-regular fa-copy", "bookmark_add": "fa-regular fa-bookmark", "delete": "fa-regular fa-trash-can", "keyboard_arrow_up": "fa-solid fa-chevron-up", "keyboard_arrow_down": "fa-solid fa-chevron-down", "more_horiz": "fa-solid fa-ellipsis", "open_in_new": "fa-solid fa-arrow-up-right-from-square", "expand_more": "fa-solid fa-chevron-down", "unfold_more": "fa-solid fa-angles-down", "unfold_less": "fa-solid fa-angles-up", "search_off": "fa-solid fa-magnifying-glass", "inbox": "fa-solid fa-inbox", "drag_indicator": "fa-solid fa-grip-vertical", "move_to_inbox": "fa-solid fa-inbox", "architecture": "fa-solid fa-compass-drafting", "check": "fa-solid fa-check", "check_circle": "fa-regular fa-circle-check", "info": "fa-solid fa-circle-info", "error": "fa-solid fa-circle-exclamation", "progress_activity": "fa-solid fa-spinner", "arrow_upward": "fa-solid fa-arrow-up", "arrow_downward": "fa-solid fa-arrow-down", "folder": "fa-regular fa-folder", "contrast": "fa-solid fa-circle-half-stroke", "library_add": "fa-regular fa-clone", "visibility": "fa-regular fa-eye", "edit": "fa-solid fa-pen"};
const ms = (n, cls = '') => `<i class="${FA[n] || 'fa-solid fa-circle'} ms ${cls}" aria-hidden="true" data-i="${n}"></i>`;
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const parseD = (s) => s ? new Date(s.replace(' ', 'T')) : null;
const fmtDate = (s) => { const d = parseD(s); return d ? `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : ''; };
const fmtDay = (s) => { const d = parseD(s); return d ? `${d.getDate()} de ${MONL[d.getMonth()]}` : ''; };
const fmtTime = (s) => { const d = parseD(s); return d ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : ''; };

/* ── dados ─────────────────────────────────────────── */
let works = D.works;
let byId = Object.fromEntries(works.map(w => [w.id, w]));
const frags = D.fragments;
const fragsByWork = {};
frags.forEach(f => (fragsByWork[f.bib_res_id] ||= []).push(f));
Object.values(fragsByWork).forEach(a => a.sort((x, y) => x.id - y.id));
const comps = D.compilations;
const compsOfWork = (id) => comps.filter(c => c.works.includes(id));
const compsOfFrag = (id) => comps.filter(c => c.members.some(m => m.fragment_id === id));
const kindLabel = (t) => t === 'quote' ? 'Citação' : 'Comentário';
const kindIcon = (t) => t === 'quote' ? 'format_quote' : 'chat_bubble';
const qt = (s) => /^[“"«]/.test(String(s).trim()) ? esc(s) : `“${esc(s)}”`;
const shortCite = (f) => `(${f.citation_author}, ${f.display_year}${f.location_value ? ', ' + f.location_value : ''})`;
const refHtml = (w) => w.ref.map(([t, s]) => s === 'bold' ? `<b>${esc(t)}</b>` : s === 'italic' ? `<i>${esc(t)}</i>` : esc(t)).join('');
const refPlain = (w) => w.ref.map(([t]) => t).join('').trim();
const authorsLine = (w) => w.authors.length ? w.authors.join(', ') : 'Sem autoria';
const yearNum = (y) => { const m = String(y).match(/\d+/); const n = m ? +m[0] : 99999; return /a\.C\./.test(y) ? -n : n; };
const TYPE_ICON = {
  'Livros em geral': 'menu_book', 'Trabalho acadêmico': 'school', 'Correspondência': 'mail',
  'Artigo de revista': 'article', 'Revista': 'auto_stories', 'Coleção periódica': 'library_books', 'Artigo de jornal': 'newspaper',
  'Anais em volume único': 'event_note', 'Anais em periódico': 'event_note',
  'Legislação': 'gavel', 'Jurisprudência': 'account_balance', 'Patente': 'lightbulb',
  'Documento digital': 'description', 'Audiovisual': 'movie', 'Áudio': 'music_note', 'Partitura': 'queue_music',
  'Documento visual': 'image', 'Cartográfico': 'map', 'Tridimensional': 'deployed_code'
};
const TYPE_GROUPS = [
  ['Textos', ['Livros em geral', 'Trabalho acadêmico', 'Correspondência']],
  ['Periódicos', ['Artigo de revista', 'Revista', 'Coleção periódica', 'Artigo de jornal']],
  ['Eventos', ['Anais em volume único', 'Anais em periódico']],
  ['Jurídico', ['Legislação', 'Jurisprudência', 'Patente']],
  ['Mídia e objetos', ['Audiovisual', 'Áudio', 'Partitura', 'Documento visual', 'Cartográfico', 'Tridimensional']],
  ['Digital', ['Documento digital']],
];
const TYPE_DESC = { 'Livros em geral': 'Livro, enciclopédia, dicionário ou catálogo' };

/* ── estado ────────────────────────────────────────── */
const S = {
  view: 'inicio', type: null, compFilter: null, comp: 1, q: '', sortKey: 'created', sortDir: 'desc', sel: null, itab: 'geral', checked: new Set(),
  fKind: 'all', fq: '', collapsed: new Set(), tab: 'caderno', idea: null,
  theme: 'dark', palette: null, form: null, menu: null,
};
try { const t = localStorage.getItem('hup-theme'); if (t) S.theme = t; } catch (e) {}
const hist = { stack: [], i: -1 };
const snap = () => ({ view: S.view, comp: S.comp, tab: S.tab, sel: S.sel, type: S.type });
function go(view, extra = {}, push = true) {
  Object.assign(S, { view }, extra);
  if (push) { hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(snap()); hist.i = hist.stack.length - 1; }
  S.menu = null; render(); $('#view').scrollTop = 0;
}
function travel(d) { const j = hist.i + d; if (j < 0 || j >= hist.stack.length) return; hist.i = j; go(hist.stack[j].view, { ...hist.stack[j] }, false); }

/* ── shell ─────────────────────────────────────────── */
function renderShell() {
  const item = (v, icon, label, count) => `<button class="nav-item" data-go="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${ms(icon)}<span class="t">${label}</span>${count != null ? `<span class="count">${count}</span>` : ''}</button>`;
  $('#nav').innerHTML = `
    <div class="nav-group">
      ${item('inicio', 'home', 'Início')}
      ${item('acervo', 'library_books', 'Acervo', works.length)}
      ${item('fragmentos', 'format_quote', 'Fragmentos', frags.length)}
    </div>
    <div class="nav-group">
      <div class="nav-head"><span>Compilações</span><button class="icon-btn" aria-label="Nova compilação" title="Nova compilação" data-action="toast" data-msg="Nova compilação">${ms('add', 'sm')}</button></div>
      ${comps.map(c => `<button class="nav-item" data-go="compilacao" data-comp="${c.id}" ${S.view === 'compilacao' && S.comp === c.id ? 'aria-current="page"' : ''}><span class="proj-dot"><i></i></span><span class="t">${esc(c.name)}</span></button>`).join('')}
      ${item('compilacoes', 'folder_open', 'Todas as compilações', comps.length)}
    </div>
    <div class="nav-group">
      <div class="nav-head"><span>Explorar</span></div>
      ${item('estruturas', 'hub', 'Estruturas de Saber')}
      ${item('nous', 'neurology', 'Nous')}
    </div>`;
  const cfg = $('#nav-config');
  if (S.view === 'config') cfg.setAttribute('aria-current', 'page'); else cfg.removeAttribute('aria-current');
  $('#theme-btn').innerHTML = ms('contrast', 'sm');
  $('#theme-btn').title = S.theme === 'dark' ? 'Usar tema claro' : 'Usar tema escuro';
  $('[data-action="back"]').disabled = hist.i <= 0;
  $('[data-action="fwd"]').disabled = hist.i >= hist.stack.length - 1;
}
function crumbs(parts) {
  $('#crumbs').innerHTML = parts.map((p, i) => i === parts.length - 1
    ? `<span class="cur" aria-current="page">${esc(p[0])}</span>`
    : `<button data-go="${p[1]}">${esc(p[0])}</button>${ms('chevron_right', 'sep')}`).join('');
}
const pageHead = ({ title, desc, meta = '', actions = '' }) => `<header class="page-head"><div style="min-width:0"><h1 class="h1">${esc(title)}</h1>${desc ? `<p class="desc">${desc}</p>` : ''}${meta ? `<div class="head-meta">${meta}</div>` : ''}</div><div class="actions">${actions}</div></header>`;

/* ── início ────────────────────────────────────────── */
function viewInicio() {
  crumbs([['Início']]);
  const quotes = frags.filter(f => f.fragment_type === 'quote').length;
  const types = Object.entries(works.reduce((m, w) => (m[w.type] = (m[w.type] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
  const noFrag = works.filter(w => !(fragsByWork[w.id] || []).length).length;
  const linked = new Set(comps.flatMap(c => c.works)).size;
  const kpi = (icon, l, v, s, attrs) => `<button class="kpi" ${attrs}><span class="l">${ms(icon)}${l}</span><span class="v">${v}</span><span class="s">${s}</span></button>`;
  const events = [
    ...works.map(w => ({ at: w.created, icon: TYPE_ICON[w.type] || 'description', html: `Obra cadastrada: <b>${esc(w.title)}</b>`, snip: authorsLine(w) })),
    ...frags.map(f => ({ at: f.created, icon: kindIcon(f.fragment_type), html: `${kindLabel(f.fragment_type)} em <b>${esc(f.work_title)}</b>`, snip: f.excerpt, serif: f.fragment_type === 'quote' })),
  ].filter(e => e.at).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 8);
  let lastDay = '';
  const feed = events.map(e => { const day = fmtDay(e.at); const head = day !== lastDay ? `<li class="feed-day">${day}</li>` : ''; lastDay = day; return head + `<li><span class="ico">${ms(e.icon)}</span><div style="min-width:0"><div class="what">${e.html}</div><div class="snip ${e.serif ? 'serif' : ''}">${esc(e.snip)}</div></div><span class="when">${fmtTime(e.at)}</span></li>`; }).join('');
  const max = types[0][1];
  return `${pageHead({ title: 'Gabinete de Leitura', desc: 'Seu repositório pessoal de bibliografia e escrita.', actions: `<button class="btn" data-action="new-fragment">${ms('format_quote')}Novo fragmento</button><button class="btn primary" data-action="new-work">${ms('add')}Nova obra</button>` })}
    <div class="card kpis">
      ${kpi('library_books', 'Obras', works.length, `em ${plural(types.length, 'tipo documental', 'tipos documentais')}`, 'data-go="acervo"')}
      ${kpi('format_quote', 'Fragmentos', frags.length, `${quotes} citações · ${frags.length - quotes} comentários`, 'data-go="fragmentos"')}
      ${kpi('folder_open', 'Compilações', comps.length, plural(linked, 'obra vinculada', 'obras vinculadas'), 'data-go="compilacoes"')}
      ${kpi('edit_note', 'Obras sem fragmentos', noFrag, 'ainda não fichadas', 'data-go="acervo" data-sortkey="frag" data-sortdir="asc"')}
    </div>
    <div class="home-grid">
      <div class="stack">
        <section class="card">
          <div class="card-head"><h2 class="card-title">Compilações em andamento</h2><button class="link" data-go="compilacoes">Ver todas${ms('chevron_right')}</button></div>
          <table class="dtable"><thead><tr><th>Projeto</th><th class="r">Obras</th><th class="r">Fragmentos</th><th class="r">Ideias</th><th class="r">Atualizada</th><th style="width:1%"></th></tr></thead>
          <tbody>${comps.map(c => `<tr data-go="compilacao" data-comp="${c.id}" data-tab="caderno" tabindex="0"><td><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.description)}</div></td><td class="r">${c.works.length}</td><td class="r">${c.members.length}</td><td class="r">${c.sections.length}</td><td class="r faint">${fmtDate(c.updated)}</td><td><button class="btn sm" data-go="compilacao" data-comp="${c.id}" data-tab="caderno">Abrir caderno</button></td></tr>`).join('')}</tbody></table>
        </section>
        <section class="card">
          <div class="card-head"><h2 class="card-title">Atividade recente</h2><span class="faint" style="font-size:var(--text-xs)">Últimos ${events.length} registros</span></div>
          <ul class="feed">${feed}</ul>
        </section>
      </div>
      <div class="stack">
        <section class="card">
          <div class="card-head"><h2 class="card-title">Acervo por tipo</h2><button class="link" data-go="acervo">Abrir acervo${ms('chevron_right')}</button></div>
          <ul class="bars">${types.map(([t, n]) => `<li><button data-go="acervo" data-type="${esc(t)}">${esc(t)}</button><span class="bar" aria-hidden="true"><i style="width:${Math.max(4, n / max * 100)}%"></i></span><span class="v">${n}</span></li>`).join('')}</ul>
        </section>
        <section class="card">
          <div class="card-head"><h2 class="card-title">Atalhos</h2></div>
          <ul class="shortcuts">
            <li><button data-action="new-work">${ms('add_notes')}<span class="t">Inserir nova obra</span><kbd>⌘N</kbd></button></li>
            <li><button data-action="new-fragment">${ms('format_quote')}<span class="t">Registrar fragmento</span><kbd>⌘⇧F</kbd></button></li>
            <li><button data-action="palette">${ms('search')}<span class="t">Buscar no gabinete</span><kbd>⌘K</kbd></button></li>
            <li><button aria-disabled="true" title="Inserir obra por BibTeX, ISBN, ISSN, DOI ou PDF">${ms('upload_file')}<span class="t">Importar metadados</span><span class="badge">Planejado</span></button></li>
            <li><button aria-disabled="true" title="Exportar referências e dados">${ms('ios_share')}<span class="t">Exportar referências</span><span class="badge">Planejado</span></button></li>
          </ul>
        </section>
        <figure class="epigraph">
          <p>“Reunir o que se pôde ouvir ou ler, e isso com uma finalidade que nada mais é que a constituição de si.”</p>
          <figcaption><cite>Michel Foucault, A escrita de si</cite></figcaption>
        </figure>
      </div>
    </div>`;
}

/* ── acervo ────────────────────────────────────────── */
function visibleWorks() {
  const q = S.q.trim().toLowerCase();
  let list = works.filter(w => (!S.type || w.type === S.type) && (!S.compFilter || compsOfWork(w.id).some(c => c.id === S.compFilter)) && (!q || [w.title, w.subtitle, w.year, ...w.authors].join(' ').toLowerCase().includes(q)));
  const dir = S.sortDir === 'asc' ? 1 : -1;
  const key = { title: w => w.title.toLocaleLowerCase('pt'), author: w => authorsLine(w).toLocaleLowerCase('pt'), type: w => w.type, year: w => yearNum(w.year), frag: w => (fragsByWork[w.id] || []).length, created: w => w.created || '' }[S.sortKey];
  list.sort((a, b) => { const x = key(a), y = key(b); return x < y ? -dir : x > y ? dir : (b.id - a.id); });
  const nest = !S.type && !S.compFilter && !q && S.sortKey === 'created';
  if (nest) {
    const isKid = (w) => w.parent && byId[w.parent];
    const tops = list.filter(w => !isKid(w));
    list = tops.flatMap(w => [w, ...list.filter(k => k.parent === w.id)]);
  }
  return { list, nest };
}
function viewAcervo() {
  crumbs([['Acervo']]);
  const { list, nest } = visibleWorks();
  if (S.sel && !byId[S.sel]) S.sel = null;
  const typesN = new Set(works.map(w => w.type)).size;
  const th = (key, label, cls = '') => { const on = S.sortKey === key; return `<span class="${cls}"><button data-sort="${key}" aria-sort="${on ? (S.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}">${label}${on ? ms(S.sortDir === 'asc' ? 'arrow_upward' : 'arrow_downward') : ''}</button></span>`; };
  const visIds = list.map(w => w.id);
  const nChecked = visIds.filter(id => S.checked.has(id)).length;
  const allState = nChecked === 0 ? '' : nChecked === visIds.length ? 'checked' : 'data-indeterminate="1"';
  const toolbar = S.checked.size ? `<div class="bulkbar" role="toolbar" aria-label="Ações em lote">
      <span class="n">${plural(S.checked.size, 'obra selecionada', 'obras selecionadas')}</span>
      <button class="btn sm" data-action="bulk-copy">${ms('content_copy')}<span>Copiar referências</span></button>
      <button class="btn sm" data-action="toast" data-msg="Escolha a compilação de destino">${ms('bookmark_add')}Adicionar à compilação</button>
      <button class="btn sm danger" data-action="bulk-delete">${ms('delete')}Excluir</button>
      <span style="flex:1"></span><button class="btn sm ghost" data-action="clear-checked">Limpar seleção<kbd>esc</kbd></button>
    </div>` : `<div class="toolbar" role="toolbar" aria-label="Filtros">
      <label class="searchbox" style="width:280px">${ms('search')}<span class="sr">Buscar obra</span><input class="input" id="q" placeholder="Buscar por título, autor ou ano" value="${esc(S.q)}" autocomplete="off"></label>
      ${S.type ? `<span class="chip-filter on">Tipo: <b>${esc(S.type)}</b><button class="x" data-action="clear-type" aria-label="Remover filtro de tipo">${ms('close', 'sm')}</button></span>` : `<button class="chip-filter" data-menu="type" aria-haspopup="menu">${ms('add', 'sm')}Tipo</button>`}
      ${S.compFilter ? `<span class="chip-filter on">Compilação: <b>${esc(comps.find(c => c.id === S.compFilter).name)}</b><button class="x" data-action="clear-comp" aria-label="Remover filtro de compilação">${ms('close', 'sm')}</button></span>` : `<button class="chip-filter" data-menu="compfilter" aria-haspopup="menu">${ms('add', 'sm')}Compilação</button>`}
      <span class="spacer"></span><span class="count">${list.length === works.length ? plural(works.length, 'obra', 'obras') : `${list.length} de ${works.length} obras`}</span>
    </div>`;
  return `${pageHead({ title: 'Acervo', desc: `${plural(works.length, 'obra catalogada', 'obras catalogadas')} em ${typesN} tipos documentais.`, actions: `<button class="btn" disabled title="Planejado: BibTeX, ISBN, ISSN, DOI ou PDF">${ms('upload_file')}Importar</button><button class="btn primary" data-action="new-work">${ms('add')}Nova obra</button>` })}
    ${toolbar}
    <div class="split ${S.sel ? '' : 'no-insp'}">
      <div class="grid-wrap">
        <div class="grid-scroll" id="grid-scroll">
          <div class="g-row g-head" role="row">
            <span><input type="checkbox" class="cb" data-action="check-all" aria-label="Selecionar todas" ${allState}></span>
            ${th('title', 'Título')}${th('author', 'Autoria', 'c-author')}${th('type', 'Tipo', 'c-type')}${th('year', 'Ano', 'r')}${th('frag', 'Frag.', 'r c-frag')}${th('created', 'Adicionada', 'r c-added')}
          </div>
          <div class="g-body" role="grid" aria-label="Obras do acervo" aria-rowcount="${list.length}">
            ${list.length ? list.map(w => workRow(w, nest && w.parent && byId[w.parent])).join('') : `<div style="padding:var(--space-xl)"><div class="empty-state">${ms('search_off')}<strong>Nenhuma obra encontrada</strong><span>Nada corresponde a “${esc(S.q)}”${S.type ? ` em ${esc(S.type)}` : ''}. Busque pelo sobrenome do autor ou pelo ano.</span><button class="btn sm" data-action="clear-filters">Limpar filtros</button></div></div>`}
          </div>
        </div>
        <div class="grid-foot"><span>${S.sel && byId[S.sel] ? `Aberta: ${esc(byId[S.sel].title)}` : 'Clique numa obra para ver os detalhes'}</span><span class="keys"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>espaço</kbd> marcar</span><span><kbd>⌘C</kbd> copiar referência</span></span></div>
      </div>
      ${S.sel ? inspector(byId[S.sel]) : ''}
    </div>`;
}
function workRow(w, isChild) {
  const n = (fragsByWork[w.id] || []).length;
  const ck = S.checked.has(w.id);
  return `<div class="g-row ${isChild ? 'child' : ''} ${ck ? 'checked' : ''}" role="row" tabindex="0" data-row="${w.id}" aria-selected="${S.sel === w.id}">
    <span><input type="checkbox" class="cb" data-check="${w.id}" ${ck ? 'checked' : ''} aria-label="Marcar ${esc(w.title)}" tabindex="-1"></span>
    <span class="c-title"><span class="t">${esc(w.title)}</span>${w.subtitle ? `<span class="st">${esc(w.subtitle)}</span>` : ''}</span>
    <span class="c-text c-author">${esc(authorsLine(w))}</span>
    <span class="c-text c-type">${esc(w.type)}</span>
    <span class="c-num r">${esc(w.year)}</span>
    <span class="c-num r c-frag ${n ? '' : 'c-zero'}">${n}</span>
    <span class="c-num r c-added faint">${fmtDate(w.created)}</span>
  </div>`;
}
function inspector(w) {
  if (!w) return '';
  const fs = fragsByWork[w.id] || [];
  const parent = w.parent && byId[w.parent];
  const kids = works.filter(k => k.parent === w.id);
  const cs = compsOfWork(w.id);
  const prop = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  const tab = (k, l, n) => `<button class="tab" role="tab" data-itab="${k}" aria-selected="${S.itab === k}">${l}${n != null ? `<span class="n">${n}</span>` : ''}</button>`;
  const body = S.itab === 'fragmentos'
    ? (fs.length ? fs.map(f => `<div class="mini-frag"><div style="min-width:0"><div class="meta"><b>${kindLabel(f.fragment_type)}</b>${f.location_value ? `<span class="sep"></span><span>${esc(f.location_value)}</span>` : ''}</div><p class="clamp-3">${f.fragment_type === 'quote' ? qt(f.excerpt) : esc(f.excerpt)}</p></div><button class="icon-btn" data-action="copy-frag" data-id="${f.id}" aria-label="Copiar com citação" title="Copiar com citação">${ms('content_copy', 'sm')}</button></div>`).join('') + `<div style="padding:var(--space-md) var(--space-lg)"><button class="btn sm" data-action="new-fragment">${ms('add')}Novo fragmento</button></div>`
      : `<div style="padding:var(--space-lg)"><div class="empty-state">${ms('format_quote')}<strong>Nenhum fragmento</strong><span>Registre uma citação ou um comentário desta obra.</span><button class="btn sm" data-action="new-fragment">${ms('add')}Novo fragmento</button></div></div>`)
    : `<section class="insp-sec">
        <div class="sec-head"><h3 class="sec-title">Referência ABNT</h3><button class="btn sm" data-action="copy-ref" data-id="${w.id}">${ms('content_copy')}<span>Copiar</span></button></div>
        <div class="ref-box">${w.ref.length ? refHtml(w) : '<span class="faint">Este tipo ainda não tem formatador.</span>'}</div>
      </section>
      <section class="insp-sec">
        <h3 class="sec-title">Propriedades</h3>
        <dl class="props">
          ${prop('Tipo', esc(w.type))}${prop('Autoria', esc(authorsLine(w)))}${prop('Ano', esc(w.year))}${prop('Local', esc(w.place))}${prop('Editora', esc(w.publisher))}${prop('Páginas', esc(w.pages))}
          ${parent ? prop('Parte de', `<button class="link" data-row-go="${parent.id}">${esc(parent.title)}</button>`) : ''}
          ${kids.length ? prop('Partes', kids.map(k => `<button class="link" data-row-go="${k.id}">${esc(k.title)}</button>`).join('<br>')) : ''}
          ${prop('Compilações', cs.length ? cs.map(c => `<button class="link" data-go="compilacao" data-comp="${c.id}" data-tab="obras">${esc(c.name)}</button>`).join('<br>') : '<span class="faint">Nenhuma</span>')}
          ${prop('Adicionada', fmtDate(w.created))}
        </dl>
      </section>
      ${w.desc ? `<section class="insp-sec"><div class="sec-head"><h3 class="sec-title">Síntese</h3><span class="badge">${ms('neurology')}Nous</span></div><p class="prose">${esc(w.desc).replace(/\*([^*]+)\*/g, '<i>$1</i>')}</p></section>` : ''}`;
  return `<aside class="inspector" aria-label="Detalhes da obra">
    <div class="insp-head">
      <div class="insp-top"><span class="badge">${ms(TYPE_ICON[w.type] || 'description')}${esc(w.type)}</span><span class="spacer"></span>
        <button class="icon-btn" data-action="insp-prev" aria-label="Obra anterior" title="Anterior">${ms('keyboard_arrow_up')}</button>
        <button class="icon-btn" data-action="insp-next" aria-label="Próxima obra" title="Próxima">${ms('keyboard_arrow_down')}</button>
        <button class="icon-btn" data-action="close-insp" aria-label="Fechar painel" title="Fechar (esc)">${ms('close')}</button></div>
      <h2 class="insp-title">${esc(w.title)}</h2>
      ${w.subtitle ? `<p class="insp-sub">${esc(w.subtitle)}</p>` : ''}
      <p class="insp-by">${esc(authorsLine(w))} · <span class="tnum">${esc(w.year)}</span></p>
      <div class="insp-actions">
        <button class="btn sm" data-action="toast" data-msg="Abre o formulário de obra já preenchido">${ms('edit')}Editar</button>
        <button class="btn sm" data-action="new-fragment">${ms('format_quote')}Fragmento</button>
        <button class="icon-btn boxed" data-menu="work-more" data-id="${w.id}" aria-haspopup="menu" aria-label="Mais ações" title="Mais ações">${ms('more_horiz')}</button>
      </div>
    </div>
    <div class="insp-tabs" role="tablist">${tab('geral', 'Visão geral')}${tab('fragmentos', 'Fragmentos', fs.length)}</div>
    <div class="insp-body">${body}</div>
  </aside>`;
}

/* ── fragmentos ────────────────────────────────────── */
function fragOrder() {
  const q = S.fq.trim().toLowerCase();
  const list = frags.filter(f => (S.fKind === 'all' || f.fragment_type === S.fKind) && (!q || (f.excerpt + ' ' + f.work_title + ' ' + f.citation_author).toLowerCase().includes(q)));
  return { list, order: [...new Set(list.map(f => f.bib_res_id))].filter(id => byId[id]).sort((a, b) => b - a) };
}
function viewFragmentos() {
  crumbs([['Fragmentos']]);
  const { list, order } = fragOrder();
  const nQ = frags.filter(f => f.fragment_type === 'quote').length;
  const nWorks = new Set(frags.map(f => f.bib_res_id)).size;
  const seg = (k, l, n) => `<button data-fkind="${k}" aria-pressed="${S.fKind === k}">${l}<span class="n">${n}</span></button>`;
  const allCollapsed = order.length && order.every(id => S.collapsed.has(id));
  return `${pageHead({ title: 'Fragmentos', desc: `${frags.length} citações e comentários de ${nWorks} obras do acervo.`, actions: `<button class="btn primary" data-action="new-fragment">${ms('add')}Novo fragmento</button>` })}
    <div class="toolbar" role="toolbar">
      <div class="seg" role="group" aria-label="Tipo">${seg('all', 'Todos', frags.length)}${seg('quote', 'Citações', nQ)}${seg('comment', 'Comentários', frags.length - nQ)}</div>
      <label class="searchbox" style="width:300px">${ms('search')}<span class="sr">Filtrar</span><input class="input" id="fq" placeholder="Filtrar por texto, obra ou autor" value="${esc(S.fq)}" autocomplete="off"></label>
      <span class="spacer"></span>
      <span class="count">${list.length === frags.length ? plural(order.length, 'obra', 'obras') : `${list.length} de ${frags.length} em ${plural(order.length, 'obra', 'obras')}`}</span>
      <button class="btn sm ghost" data-action="${allCollapsed ? 'expand-all' : 'collapse-all'}">${ms(allCollapsed ? 'unfold_more' : 'unfold_less')}${allCollapsed ? 'Expandir tudo' : 'Recolher tudo'}</button>
    </div>
    <div class="flist">
      ${order.length ? order.map(id => { const w = byId[id]; const items = list.filter(f => f.bib_res_id === id); const col = S.collapsed.has(id); return `<section class="fgroup ${col ? 'collapsed' : ''}">
        <div class="fg-head">
          <button class="icon-btn" data-collapse="${id}" aria-expanded="${!col}" aria-label="${col ? 'Expandir' : 'Recolher'} ${esc(w.title)}">${ms('expand_more', 'chev')}</button>
          <span class="fg-title">${esc(w.title)}</span><span class="fg-by">${esc(authorsLine(w))} · ${esc(w.year)}</span>
          <span class="spacer"></span><span class="badge tnum">${items.length}</span>
          <button class="icon-btn" data-go="acervo" data-sel="${id}" aria-label="Abrir obra no acervo" title="Abrir obra no acervo">${ms('open_in_new', 'sm')}</button>
        </div>
        ${col ? '' : items.map(fragRow).join('')}
      </section>`; }).join('') : `<div class="empty-state">${ms('search_off')}<strong>Nenhum fragmento encontrado</strong><span>Nada corresponde a “${esc(S.fq)}”.</span><button class="btn sm" data-action="clear-fq">Limpar filtro</button></div>`}
    </div>`;
}
function fragRow(f) {
  const isQ = f.fragment_type === 'quote';
  const cs = compsOfFrag(f.id);
  return `<article class="frow">
    ${ms(kindIcon(f.fragment_type), 'sm')}
    <div style="min-width:0">
      ${isQ ? `<p class="quote">${qt(f.excerpt)}</p>` : `<p class="comment">${esc(f.excerpt)}</p>`}
      <div class="meta"><b>${kindLabel(f.fragment_type)}</b>${f.location_value ? `<span class="sep"></span><span>${esc(f.location_value)}</span>` : ''}<span class="sep"></span><span>${fmtDate(f.created)}</span>${cs.map(c => `<span class="badge accent">${ms('folder')}${esc(c.name)}</span>`).join('')}</div>
    </div>
    <div class="tools">
      <button class="icon-btn" data-action="copy-frag" data-id="${f.id}" aria-label="Copiar com citação" title="Copiar com citação">${ms('content_copy', 'sm')}</button>
      <button class="icon-btn" data-action="toast" data-msg="Escolha a compilação de destino" aria-label="Adicionar à compilação" title="Adicionar à compilação">${ms('bookmark_add', 'sm')}</button>
      <button class="icon-btn" data-action="toast" data-msg="Editar fragmento" aria-label="Editar" title="Editar">${ms('edit', 'sm')}</button>
    </div>
  </article>`;
}

/* ── compilação ────────────────────────────────────── */
function viewCompilacao() {
  const c = comps.find(x => x.id === S.comp);
  crumbs([['Compilações', 'compilacoes'], [c.name]]);
  const tab = (k, l, n) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${n != null ? `<span class="n">${n}</span>` : ''}</button>`;
  const meta = `<span class="badge">${plural(c.works.length, 'obra', 'obras')}</span><span class="badge">${plural(c.members.length, 'fragmento', 'fragmentos')}</span><span class="badge">${plural(c.sections.length, 'ideia', 'ideias')}</span><span class="badge">Atualizada em ${fmtDate(c.updated)}</span>`;
  const body = S.tab === 'caderno' ? caderno(c) : `<div style="overflow:auto;flex:1;padding-top:var(--space-lg)">${S.tab === 'obras' ? projObras(c) : projVisao(c)}</div>`;
  return `${pageHead({ title: c.name, desc: esc(c.description), meta, actions: `<button class="btn" data-action="copy-skeleton">${ms('content_copy')}<span>Copiar esqueleto</span></button><button class="icon-btn boxed" style="width:32px;height:32px" data-menu="comp-more" aria-haspopup="menu" aria-label="Mais ações" title="Mais ações">${ms('more_horiz')}</button>` })}
    <div class="tabs" role="tablist">${tab('visao', 'Visão geral')}${tab('obras', 'Obras e fragmentos', c.works.length)}${tab('caderno', 'Caderno de trabalho', c.sections.length)}</div>
    ${body}`;
}
function caderno(c) {
  const fr = (id) => frags.find(f => f.id === id);
  const inSec = (sid) => c.members.filter(m => m.section_id === sid).sort((a, b) => a.pos - b.pos);
  const pending = c.members.filter(m => !m.section_id);
  const used = [...new Set(c.members.map(m => fr(m.fragment_id).bib_res_id))].map(id => byId[id]).filter(Boolean);
  if (S.idea == null) S.idea = c.sections[0]?.id;
  return `<div class="caderno">
    <nav class="outline" aria-label="Roteiro">
      <div>
        <div class="nav-head"><span>Roteiro</span><button class="icon-btn" aria-label="Nova ideia" title="Nova ideia" data-action="toast" data-msg="Nova ideia adicionada ao fim do roteiro">${ms('add', 'sm')}</button></div>
        <ol class="ol-list">${c.sections.map((s, i) => `<li><button class="ol-item" data-idea="${s.id}" aria-current="${S.idea === s.id}"><span class="i">${i + 1}</span><span class="t">${esc(s.title)}</span><span class="n">${inSec(s.id).length}</span></button></li>`).join('')}</ol>
      </div>
      <div>
        <div class="nav-head"><span>Fila</span></div>
        <ol class="ol-list"><li><button class="ol-item">${ms('inbox', 'sm')}<span class="t">A organizar</span><span class="n">${pending.length}</span></button></li></ol>
      </div>
      <p class="ol-note">Arraste para reordenar. Remover uma ideia devolve os fragmentos dela para “A organizar”.</p>
    </nav>
    <div class="writing" id="writing"><div class="writing-inner">
      ${c.sections.map((s, i) => `<section class="idea" id="idea-${s.id}" aria-labelledby="it-${s.id}">
        <div class="idea-head"><h2 class="idea-title" id="it-${s.id}"><span class="i">${i + 1}</span>${esc(s.title)}</h2>
          <div class="actions"><button class="icon-btn" aria-label="Editar ideia" title="Editar ideia" data-action="toast" data-msg="Editar ideia">${ms('edit', 'sm')}</button><button class="icon-btn" aria-label="Mais ações" title="Mover, renomear ou remover" data-action="toast" data-msg="Mover, renomear ou remover ideia">${ms('more_horiz', 'sm')}</button></div></div>
        ${s.central_idea ? `<dl class="idea-central"><dt>Ideia central</dt><dd>${esc(s.central_idea)}</dd></dl>` : ''}
        ${inSec(s.id).length ? inSec(s.id).map(m => { const f = fr(m.fragment_id); return `<article class="fblock">
          <div class="fb-head">${ms('drag_indicator', 'sm grip')}<span class="w">${esc(f.work_title)}</span><span class="badge">${kindLabel(f.fragment_type)}</span><span class="spacer"></span>
            <button class="icon-btn" data-action="copy-frag" data-id="${f.id}" aria-label="Copiar com citação" title="Copiar com citação">${ms('content_copy', 'sm')}</button>
            <button class="icon-btn" aria-label="Mais ações" title="Mover para outra ideia ou remover" data-action="toast" data-msg="Mover para outra ideia ou devolver para A organizar">${ms('more_horiz', 'sm')}</button></div>
          <div class="fb-body"><p class="quote">${qt(f.excerpt)}</p><div class="meta">${esc(shortCite(f))}</div></div>
          <div class="fb-foot"><span class="faint" style="font-size:var(--text-xs)">${m.note ? esc(m.note) : 'Sem nota de articulação'}</span><button class="btn sm ghost" data-action="toast" data-msg="Nota de articulação: o texto que liga este fragmento à ideia">${ms('add_notes')}Adicionar nota</button></div>
        </article>`; }).join('') : `<div class="empty-state">${ms('move_to_inbox')}<strong>Nenhum fragmento nesta ideia</strong><span>Marque fragmentos em Obras e fragmentos e escolha esta ideia como destino.</span><button class="btn sm" data-tab="obras">Escolher fragmentos</button></div>`}
      </section>`).join('')}
    </div></div>
    <aside class="rail" aria-label="Referências do caderno">
      <button class="btn primary" data-action="copy-skeleton" style="width:100%">${ms('content_copy')}<span>Copiar esqueleto com referências</span></button>
      <section><div class="sec-head"><h3 class="sec-title">Referências</h3><span class="faint tnum" style="font-size:var(--text-xs)">${used.length}</span></div>
        <ol class="ref-list">${used.map(w => `<li><span>${refHtml(w)}</span></li>`).join('')}</ol></section>
      <section><div class="sec-head"><h3 class="sec-title">Obras do projeto</h3><span class="faint tnum" style="font-size:var(--text-xs)">${c.works.length}</span></div>
        <ul class="plain-list">${c.works.filter(id => byId[id]).map(id => `<li><button data-go="acervo" data-sel="${id}"><span class="t">${esc(byId[id].title)}</span><span class="n">${plural((fragsByWork[id] || []).length, 'fragmento', 'fragmentos')}</span></button></li>`).join('')}</ul></section>
    </aside>
  </div>`;
}
function projObras(c) {
  const opts = (sel) => `<option value="">A organizar</option>` + c.sections.map(s => `<option ${s.id === sel ? 'selected' : ''}>${esc(s.title)}</option>`).join('');
  return `<div class="body-pad" style="max-width:1040px;display:flex;flex-direction:column;gap:var(--space-sm)">
    <div style="display:flex;gap:var(--space-xs)"><label class="searchbox" style="flex:1">${ms('search')}<span class="sr">Adicionar obra</span><input class="input" placeholder="Adicionar obra do acervo a este projeto"></label><button class="btn" data-action="new-work">${ms('add')}Criar obra</button></div>
    ${c.works.filter(id => byId[id]).map(id => { const w = byId[id]; const fs = fragsByWork[id] || []; return `<section class="card">
      <div class="card-head"><div style="min-width:0;padding:8px 0"><div style="font-weight:600">${esc(w.title)}</div><div class="meta">${esc(authorsLine(w))}<span class="sep"></span>${plural(fs.length, 'fragmento', 'fragmentos')}</div></div>
        <div class="actions"><button class="btn sm" data-action="new-fragment">${ms('add')}Fragmento</button><button class="icon-btn" aria-label="Mais ações" title="Mais ações" data-action="toast" data-msg="Reordenar, editar ou remover do projeto">${ms('more_horiz')}</button></div></div>
      ${fs.length ? fs.map(f => { const m = c.members.find(m => m.fragment_id === f.id); return `<div class="pw-frag">
        <input type="checkbox" class="cb" ${m ? 'checked' : ''} aria-label="Incluir no caderno" style="margin-top:4px">
