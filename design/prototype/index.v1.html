<style>
/* Hallmark · genre: editorial · surface: app shell (multi-page) · design-system: DESIGN.md · designed-as-app

 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow-x: clip; }
body {
  background: var(--color-paper);

}

.quote-text, .prose, .mini-frag p, .pw-frag p, .serif, .idea-central, .page-title, .resume-name, .insp-title, .wg-title, .idea-title, .p-item .t.serif, .row .title, .ro-item .t, .outline .t, .proj-works .t, .pw-work-head .t { font-variant-numeric: lining-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-xs); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--color-rule-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ── shell ─────────────────────────────────────────── */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100vh; }
.sidebar {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--color-paper);

.nav-item {
  display: flex; align-items: center; gap: var(--space-sm);

  color: var(--color-ink-2); font-size: var(--text-sm); font-weight: 500; text-align: left; white-space: nowrap;
  transition: background var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
}
.nav-item .ms { color: var(--color-ink-3); }
.nav-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.nav-item .count { color: var(--color-ink-3); }
.nav-item:hover { background: var(--color-paper-3); color: var(--color-ink); }
.nav-item:active { background: var(--color-paper-4); }

.nav-item.project .dot { width: 18px; display: grid; place-items: center; }

.theme-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; border-radius: var(--radius-sm); background: var(--color-paper-2); border: var(--rule-w) solid var(--color-rule); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

}
.crumbs { display: flex; align-items: center; gap: var(--space-2xs); min-width: 0; flex: 1; font-size: var(--text-sm); color: var(--color-ink-3); white-space: nowrap; }
.crumbs button { border: 0; background: none; color: var(--color-ink-3); padding: 2px 4px; border-radius: var(--radius-xs); }
.crumbs button:hover { color: var(--color-ink); }
.crumbs .cur { color: var(--color-ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }

.bar-actions { display: flex; align-items: center; gap: var(--space-xs); }

.win button { width: 44px; border: 0; background: none; color: var(--color-ink-3); display: grid; place-items: center; }
.win button:hover { background: var(--color-paper-3); color: var(--color-ink); }

.view { flex: 1; min-height: 0; overflow: auto; }

/* ── buttons ───────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 var(--space-sm);
  border-radius: var(--radius-sm); border: var(--rule-w) solid var(--color-rule-2);
  background: var(--color-paper-2); color: var(--color-ink);
  font-size: var(--text-sm); font-weight: 500; white-space: nowrap;
  transition: background var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
}

.btn:hover { background: var(--color-paper-3); border-color: var(--color-ink-3); }

.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; transform: none; }

.btn.primary:hover { background: var(--color-accent-2); border-color: var(--color-accent-2); }
.btn.primary[disabled] { background: var(--color-paper-3); border-color: var(--color-rule-2); color: var(--color-ink-3); opacity: 1; }
.btn.ghost { background: none; border-color: transparent; color: var(--color-ink-2); }
.btn.ghost:hover { background: var(--color-paper-3); color: var(--color-ink); border-color: transparent; }
.btn.sm { height: 28px; padding: 0 var(--space-xs); font-size: var(--text-xs); }
.btn[data-state="loading"] { pointer-events: none; }

@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border: 0; border-radius: var(--radius-sm); background: none; color: var(--color-ink-3); transition: background var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.icon-btn:hover { background: var(--color-paper-4); color: var(--color-ink); }
.icon-btn:active { transform: translateY(1px); }
.icon-btn[data-state="success"] { color: var(--color-ok); }
.icon-btn.danger:hover { color: var(--color-danger); }

/* ── inputs ────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field-label { font-size: var(--text-xs); font-weight: 600; color: var(--color-ink-2); }
.field .req { color: var(--color-accent); }

.input, .select, .textarea {
  height: 36px; width: 100%; padding: 0 var(--space-sm);
  background: var(--color-paper); color: var(--color-ink);
  border: var(--rule-w) solid var(--color-rule-2); border-radius: var(--radius-sm);
  font-size: var(--text-md);
  transition: border-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
}
.textarea { height: auto; min-height: 76px; padding: var(--space-xs) var(--space-sm); resize: vertical; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--color-ink-3); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--color-ink-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-wash); }
.input:disabled { opacity: 0.5; }
.input[aria-invalid="true"] { border-color: var(--color-danger); }
.select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--color-ink-3) 50%), linear-gradient(135deg, var(--color-ink-3) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.searchbox { position: relative; display: flex; align-items: center; }

.searchbox .input { padding-left: 34px; }
.check { display: flex; gap: var(--space-xs); align-items: flex-start; font-size: var(--text-sm); color: var(--color-ink); cursor: pointer; }
.check input { appearance: none; width: 16px; height: 16px; margin: 2px 0 0; flex: none; border: var(--rule-w) solid var(--color-ink-3); border-radius: var(--radius-xs); background: var(--color-paper); display: grid; place-items: center; cursor: pointer; }
.check input:checked { background: var(--color-accent); border-color: var(--color-accent); }
.check input:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--color-accent-ink); border-bottom: 2px solid var(--color-accent-ink); transform: translateY(-1px) rotate(-45deg); }
.check small { display: block; color: var(--color-ink-3); font-size: var(--text-xs); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius-sm); background: var(--color-paper-2); border: var(--rule-w) solid var(--color-rule); }
.seg button { height: 28px; padding: 0 var(--space-sm); border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-ink-2); font-size: var(--text-sm); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.seg button .num { color: var(--color-ink-3); }
.seg button:hover { color: var(--color-ink); }
.seg button[aria-pressed="true"] { background: var(--color-paper-4); color: var(--color-ink); }

/* ── page scaffolding ──────────────────────────────── */
.page { padding: var(--space-xl) var(--space-xl) var(--space-2xl); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-lg); margin-bottom: var(--space-xl); }
.page-title { font-family: var(--font-display); font-weight: 500; font-size: var(--text-2xl); line-height: 1.05; margin: 0; letter-spacing: -0.005em; overflow-wrap: anywhere; min-width: 0; }
.page-sub { color: var(--color-ink-2); margin: var(--space-xs) 0 0; font-size: var(--text-md); max-width: 60ch; }
.panel-title { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); margin: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); }
.panel-title .aside { font-weight: 500; color: var(--color-ink-3); }
.link { border: 0; background: none; padding: 0; color: var(--color-ink-2); font-size: var(--text-sm); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; text-decoration: underline; text-decoration-color: var(--color-rule-2); text-underline-offset: 3px; }
.link:hover { color: var(--color-accent); text-decoration-color: currentColor; }

.faint { color: var(--color-ink-3); }
.empty { border: 1px dashed var(--color-rule-2); border-radius: var(--radius-md); padding: var(--space-lg); color: var(--color-ink-3); font-size: var(--text-sm); display: flex; gap: var(--space-sm); align-items: center; }

/* ── início ────────────────────────────────────────── */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-2xl); max-width: 1180px; }
.home-date { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-ink-3); margin-bottom: var(--space-sm); }
.home-main { display: flex; flex-direction: column; gap: var(--space-xl); min-width: 0; }
.resume { background: var(--color-paper-2); border: var(--rule-w) solid var(--color-rule); border-radius: var(--radius-lg); padding: var(--space-lg) var(--space-lg) var(--space-md); display: flex; flex-direction: column; gap: var(--space-md); }
.resume-head { display: flex; justify-content: space-between; gap: var(--space-md); align-items: flex-start; }
.resume-name { font-family: var(--font-display); font-weight: 600; font-size: 1.75rem; line-height: 1.1; margin: 0; }
.resume-desc { color: var(--color-ink-2); margin: 4px 0 0; }
.meta-row { display: flex; gap: var(--space-md); color: var(--color-ink-3); flex-wrap: wrap; }

.outline li:last-child { border-bottom: 0; }

.outline .ci { color: var(--color-ink-2); font-size: var(--text-sm); margin-left: var(--space-xs); }
.resume-actions { display: flex; gap: var(--space-xs); }

.recent-item:first-of-type { padding-top: var(--space-sm); }
.quote-text { font-family: var(--font-display); font-size: var(--text-read); line-height: 1.5; color: var(--color-ink); margin: 0; white-space: pre-line; }
.clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.cite-line b { color: var(--color-ink-2); font-weight: 500; }
.home-side { display: flex; flex-direction: column; gap: var(--space-xl); }

.stat-big .v { font-family: var(--font-display); font-size: 3rem; line-height: 1; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; }
.kv { list-style: none; margin: 0; padding: 0; }
.kv li { display: flex; justify-content: space-between; gap: var(--space-sm); padding: 6px 0; border-bottom: var(--rule-w) solid var(--color-rule); color: var(--color-ink-2); }
.kv li .num { color: var(--color-ink); }
.kv button { border: 0; background: none; padding: 0; color: inherit; text-align: left; }
.kv button:hover { color: var(--color-ink); text-decoration: underline; text-underline-offset: 3px; }
.actions-list { display: flex; flex-direction: column; gap: 2px; margin-top: var(--space-sm); }
.action-row { display: flex; align-items: center; gap: var(--space-sm); height: 36px; padding: 0 var(--space-xs); border: 0; background: none; border-radius: var(--radius-sm); text-align: left; color: var(--color-ink); font-size: var(--text-sm); font-weight: 500; }
.action-row .ms { color: var(--color-accent); }
.action-row .t { flex: 1; white-space: nowrap; }
.action-row:hover { background: var(--color-paper-3); }
.action-row[aria-disabled="true"] { color: var(--color-ink-3); cursor: default; }
.action-row[aria-disabled="true"] .ms { color: var(--color-ink-3); }
.action-row[aria-disabled="true"]:hover { background: none; }
.soon { font-size: var(--text-2xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-ink-3); border: var(--rule-w) solid var(--color-rule-2); border-radius: 999px; padding: 1px 7px; }
.epigraph { border-top: var(--rule-w) solid var(--color-rule); padding-top: var(--space-md); }

/* ── acervo ────────────────────────────────────────── */
.split { display: grid; height: 100%; min-height: 0; }

.split.acervo.no-insp { grid-template-columns: 216px minmax(0, 1fr); }
.facets { border-right: var(--rule-w) solid var(--color-rule); padding: var(--space-lg) var(--space-sm); overflow: auto; display: flex; flex-direction: column; gap: var(--space-lg); }
.facet-list { display: flex; flex-direction: column; gap: 1px; margin-top: var(--space-xs); }
.facet { display: flex; align-items: center; gap: var(--space-xs); height: 30px; padding: 0 var(--space-xs); border: 0; background: none; border-radius: var(--radius-sm); color: var(--color-ink-2); font-size: var(--text-sm); text-align: left; white-space: nowrap; }
.facet .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.facet .num { color: var(--color-ink-3); }
.facet:hover { background: var(--color-paper-3); color: var(--color-ink); }
.facet[aria-pressed="true"] { background: var(--color-paper-3); color: var(--color-ink); font-weight: 600; }
.facet[aria-pressed="true"] .num { color: var(--color-accent); }
.list-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.list-tools { display: flex; gap: var(--space-sm); align-items: center; padding: var(--space-md) var(--space-lg); border-bottom: var(--rule-w) solid var(--color-rule); }

.list-head, .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 40px 32px; gap: var(--space-md); align-items: center; padding: 0 var(--space-lg); }
.list-head { height: 34px; font-size: var(--text-2xs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-ink-3); border-bottom: var(--rule-w) solid var(--color-rule); }
.list-head .r, .row .r { text-align: right; }
.rows { overflow: auto; flex: 1; }
.row { min-height: var(--row-h); padding-top: 8px; padding-bottom: 8px; border-bottom: var(--rule-w) solid var(--color-rule); cursor: pointer; position: relative; transition: background var(--dur-micro) var(--ease-out); }
.row:hover { background: var(--color-paper-2); }
.row[aria-selected="true"] { background: var(--color-paper-3); }

      <div class="brand-mark" aria-label="Hupomnēmata">hupomnemata</div>
      <div class="brand-sub">O arquivo vivo das suas ideias.</div>
    </div>
    <button class="search-trigger" data-action="palette"><span class="ms">search</span><span class="label">Buscar no gabinete</span><kbd>⌘K</kbd></button>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="nav-item" data-go="config"><span class="ms">settings</span><span class="t">Configurações</span></button>
      <div class="theme-switch" role="group" aria-label="Tema">
        <button data-theme-set="dark"><span class="ms">dark_mode</span><span>Escuro</span></button>
        <button data-theme-set="light"><span class="ms">light_mode</span><span>Claro</span></button>
      </div>
      <div class="version num"><span>v0.1</span><span>local</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="bar">
      <div class="crumbs" id="crumbs"></div>
      <div class="bar-actions" id="bar-actions"></div>
      <div class="win" aria-hidden="true">
        <button tabindex="-1"><span class="ms">remove</span></button>
        <button tabindex="-1"><span class="ms" style="font-size:15px">crop_square</span></button>
        <button tabindex="-1" class="close"><span class="ms">close</span></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="overlay"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(() => {
const D = window.HUP_DATA;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = (n, cls = '') => `<span class="ms ${cls}">${n}</span>`;
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

/* ── derived data ───────────────────────────────── */
const works = D.works;
const byId = Object.fromEntries(works.map(w => [w.id, w]));
const frags = D.fragments.slice().sort((a, b) => b.bib_res_id - a.bib_res_id || a.id - b.id);
const fragsByWork = {};
frags.forEach(f => (fragsByWork[f.bib_res_id] ||= []).push(f));
const comps = D.compilations;
const compsOfWork = (id) => comps.filter(c => c.works.includes(id));
const qt = (s) => /^[“"«]/.test(String(s).trim()) ? esc(s) : `“${esc(s)}”`;
const kindLabel = (t) => t === 'quote' ? 'Citação' : 'Paráfrase';
const shortCite = (f) => `(${f.citation_author}, ${f.display_year}${f.location_value ? ', ' + f.location_value : ''})`;
const refHtml = (w) => w.ref.map(([t, s]) => s === 'bold' ? `<b>${esc(t)}</b>` : s === 'italic' ? `<i>${esc(t)}</i>` : esc(t)).join('');
const refPlain = (w) => w.ref.map(([t]) => t).join('');
const authorsLine = (w) => w.authors.length ? w.authors.join(', ') : 'Sem autoria';
const TYPE_ICON = {
  'Livros em geral': 'menu_book', 'Trabalho acadêmico': 'school', 'Correspondência': 'mail',
  'Artigo de revista': 'article', 'Revista': 'auto_stories', 'Coleção periódica': 'library_books', 'Artigo de jornal': 'newspaper',
  'Anais de evento em volume único': 'event_note', 'Anais de evento em periódico': 'event_note', 'Anais em volume único': 'event_note', 'Anais em periódico': 'event_note',
  'Legislação': 'gavel', 'Jurisprudência': 'account_balance', 'Patente': 'lightbulb',
  'Documento digital': 'description', 'Audiovisual': 'movie', 'Áudio': 'music_note', 'Partitura': 'queue_music',
  'Documento visual': 'image', 'Cartográfico': 'map', 'Tridimensional': 'deployed_code'
};
const TYPE_GROUPS = [
  ['Textos', ['Livros em geral', 'Trabalho acadêmico', 'Correspondência']],
  ['Periódicos', ['Artigo de revista', 'Revista', 'Coleção periódica', 'Artigo de jornal']],
  ['Eventos', ['Anais em volume único', 'Anais em periódico']],
  ['Jurídico', ['Legislação', 'Jurisprudência', 'Patente']],
  ['Mídia e objetos', ['Audiovisual', 'Áudio', 'Partitura', 'Documento visual', 'Cartográfico', 'Tridimensional']],
  ['Digital', ['Documento digital']],
];
const TYPE_DESC = { 'Livros em geral': 'Livro, enciclopédia, dicionário ou catálogo.' };

/* ── state ──────────────────────────────────────── */
const S = {
  view: 'inicio', type: 'Todos', q: '', sort: 'recent', sel: 31,
  fKind: 'all', fq: '', comp: 1, tab: 'caderno', idea: 1,
  theme: 'dark', palette: null, form: null,
};
try { const t = localStorage.getItem('hup-theme'); if (t) S.theme = t; } catch (e) {}
const go = (view, extra = {}) => { Object.assign(S, { view }, extra); render(); $('#view').scrollTop = 0; };

/* ── sidebar ────────────────────────────────────── */
function renderNav() {
  const item = (v, icon, label, count) => `<button class="nav-item" data-go="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${ms(icon)}<span class="t">${label}</span>${count != null ? `<span class="count num">${count}</span>` : ''}</button>`;
  $('#nav').innerHTML = `
    <div class="nav-group">
      ${item('inicio', 'home', 'Início')}
      ${item('acervo', 'local_library', 'Acervo', works.length)}
      ${item('fragmentos', 'format_quote', 'Fragmentos', frags.length)}
    </div>
    <div class="nav-group">
      <div class="nav-label"><span>Compilações</span><button aria-label="Nova compilação" data-action="toast" data-msg="Nova compilação: fluxo mantido do app atual">${ms('add')}</button></div>
      ${comps.map(c => `<button class="nav-item project" data-go="compilacao" data-comp="${c.id}" ${S.view === 'compilacao' && S.comp === c.id ? 'aria-current="page"' : ''}><span class="dot"><i></i></span><span class="t">${esc(c.name)}</span></button>`).join('')}
      ${item('compilacoes', 'folder_open', 'Todas as compilações')}
    </div>
    <div class="nav-group">
      <div class="nav-label"><span>Explorar</span></div>
      ${item('estruturas', 'hub', 'Estruturas de Saber')}
      ${item('nous', 'neurology', 'Nous')}
    </div>`;
  document.querySelectorAll('.sidebar-foot .nav-item').forEach(b => b.toggleAttribute('aria-current', S.view === 'config'));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === S.theme)));
}

function crumbs(parts) {
  $('#crumbs').innerHTML = parts.map((p, i) => i === parts.length - 1
    ? `<span class="cur">${esc(p[0])}</span>`
    : `<button data-go="${p[1]}">${esc(p[0])}</button><span class="ms sep">chevron_right</span>`).join('');
}
const barActions = (html) => { $('#bar-actions').innerHTML = html; };

/* ── início ─────────────────────────────────────── */
function viewInicio() {
  crumbs([['Início']]);
  barActions(`<button class="btn" data-action="new-fragment">${ms('format_quote')}Novo fragmento</button><button class="btn primary" data-action="new-work">${ms('add')}Nova obra</button>`);
  const c = comps[0];
  const recent = D.fragments.slice().sort((a, b) => b.id - a.id).slice(0, 3);
  const quotes = frags.filter(f => f.fragment_type === 'quote').length;
  const typeCounts = Object.entries(works.reduce((m, w) => (m[w.type] = (m[w.type] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
  const today = new Date(2026, 10, 9).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return `<div class="page"><div class="home">
    <div class="home-main">
      <header class="reveal" style="--i:0">
        <div class="home-date">${esc(today)}</div>
        <h1 class="page-title">Gabinete de Leitura</h1>
        <p class="page-sub">Seu repositório pessoal de bibliografia e escrita.</p>
      </header>
      <section class="reveal" style="--i:1" aria-labelledby="h-cont">
        <h2 class="panel-title" id="h-cont" style="margin-bottom:var(--space-sm)">Continuar escrevendo</h2>
        ${resumeCard(c)}
      </section>
      <section class="reveal" style="--i:2" aria-labelledby="h-rec">
        <h2 class="panel-title" id="h-rec">Fragmentos recentes <button class="link" data-go="fragmentos">Ver os ${frags.length}${ms('arrow_forward')}</button></h2>
        <div class="recent">${recent.map(f => `
          <article class="recent-item">
            ${f.fragment_type === 'quote' ? `<p class="quote-text clamp-3">${qt(f.excerpt)}</p>` : `<p class="quote-text clamp-3" style="color:var(--color-ink-2)">${esc(f.excerpt)}</p>`}
            <div class="cite-line"><b>${esc(f.work_title)}</b><span>${kindLabel(f.fragment_type)}</span><span class="num">${esc(f.location_value || '')}</span></div>
          </article>`).join('')}</div>
      </section>
    </div>
    <aside class="home-side">
      <section class="reveal" style="--i:1">
        <h2 class="panel-title">Acervo</h2>
        <div class="stat-big"><span class="v">${works.length}</span><span class="muted">obras</span></div>
        <ul class="kv">${typeCounts.map(([t, n]) => `<li><button data-go="acervo" data-type="${esc(t)}">${esc(t)}</button><span class="num">${n}</span></li>`).join('')}</ul>
        <div class="stat-big" style="margin-top:var(--space-lg)"><span class="v">${frags.length}</span><span class="muted">fragmentos</span></div>
        <ul class="kv"><li><span>Citações</span><span class="num">${quotes}</span></li><li><span>Paráfrases</span><span class="num">${frags.length - quotes}</span></li></ul>
      </section>
      <section class="reveal" style="--i:2">
        <h2 class="panel-title">Começar algo</h2>
        <div class="actions-list">
          <button class="action-row" data-action="new-work">${ms('add_notes')}<span class="t">Inserir nova obra</span><kbd>⌘N</kbd></button>
          <button class="action-row" data-action="new-fragment">${ms('format_quote')}<span class="t">Registrar fragmento</span><kbd>⌘⇧F</kbd></button>
          <button class="action-row" data-action="toast" data-msg="Nova compilação: fluxo mantido do app atual">${ms('create_new_folder')}<span class="t">Nova compilação</span></button>
          <button class="action-row" aria-disabled="true" title="Importar por BibTeX, ISBN, ISSN, DOI ou PDF">${ms('upload_file')}<span class="t">Importar metadados</span><span class="soon">Em breve</span></button>
          <button class="action-row" aria-disabled="true" title="Processar leituras brutas e notas">${ms('edit_note')}<span class="t">Fichamento rápido</span><span class="soon">Em breve</span></button>
          <button class="action-row" aria-disabled="true" title="Exportar referências e dados">${ms('ios_share')}<span class="t">Exportar referências</span><span class="soon">Em breve</span></button>
        </div>
      </section>
      <figure class="epigraph reveal" style="--i:3; margin:0">
        <p>“Trata-se não de buscar o indizível, não de revelar o oculto, não de dizer o não-dito, mas de captar, pelo contrário, o já dito; reunir o que se pôde ouvir ou ler, e isso com uma finalidade que nada mais é que a constituição de si.”</p>
        <figcaption><cite>Michel Foucault, A escrita de si</cite></figcaption>
      </figure>
    </aside>
  </div></div>`;
}
function resumeCard(c) {
  const members = c.members;
  const per = (sid) => members.filter(m => m.section_id === sid).length;
  const pending = members.filter(m => !m.section_id).length;
  return `<div class="resume">
    <div class="resume-head">
      <div><h3 class="resume-name">${esc(c.name)}</h3><p class="resume-desc">${esc(c.description)}</p></div>
      <div class="resume-actions"><button class="btn" data-action="copy-skeleton">${ms('content_copy')}Copiar esqueleto</button><button class="btn primary" data-go="compilacao" data-comp="${c.id}" data-tab="caderno">Abrir caderno${ms('arrow_forward')}</button></div>
    </div>
    <div class="meta-row num"><span>${plural(c.works.length, 'obra', 'obras')}</span><span>${plural(members.length, 'fragmento', 'fragmentos')}</span><span>${plural(c.sections.length, 'ideia', 'ideias')}</span><span>${pending ? plural(pending, 'a organizar', 'a organizar') : 'nada a organizar'}</span></div>
    <ol class="outline">${c.sections.map((s, i) => `<li><span class="n num">${String(i + 1).padStart(2, '0')}</span><span><span class="t">${esc(s.title)}</span><span class="ci">${esc(s.central_idea || '')}</span></span><span class="num faint">${per(s.id) ? plural(per(s.id), 'frag.', 'frag.') : 'vazia'}</span></li>`).join('')}</ol>
  </div>`;
}

/* ── acervo ─────────────────────────────────────── */
function visibleWorks() {
  const q = S.q.trim().toLowerCase();
  let list = works.filter(w => (S.type === 'Todos' || w.type === S.type) && (!q || [w.title, w.subtitle, w.year, ...w.authors].join(' ').toLowerCase().includes(q)));
  const yearNum = (y) => { const m = String(y).match(/\d+/); const n = m ? +m[0] : 9999; return /a\.C\./.test(y) ? -n : n; };
  if (S.sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title, 'pt'));
  else if (S.sort === 'year') list.sort((a, b) => yearNum(a.year) - yearNum(b.year));
  else list.sort((a, b) => b.id - a.id);
  // nest children under parents when unfiltered and sorted by recent
  if (S.type === 'Todos' && !q && S.sort === 'recent') {
    const kids = list.filter(w => w.parent && byId[w.parent]);
    const tops = list.filter(w => !(w.parent && byId[w.parent]));
    list = tops.flatMap(w => [w, ...kids.filter(k => k.parent === w.id)]);
  }
  return list;
}
function viewAcervo() {
  crumbs([['Acervo']]);
  barActions(`<button class="btn primary" data-action="new-work">${ms('add')}Nova obra</button>`);
  const list = visibleWorks();
  if (S.sel && !list.find(w => w.id === S.sel)) S.sel = list[0]?.id ?? null;
  const counts = works.reduce((m, w) => (m[w.type] = (m[w.type] || 0) + 1, m), {});
  const types = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const facet = (t, n) => `<button class="facet" data-type="${esc(t)}" aria-pressed="${S.type === t}"><span class="t">${esc(t)}</span><span class="num">${n}</span></button>`;
  const nested = S.type === 'Todos' && !S.q && S.sort === 'recent';
  return `<div class="split acervo ${S.sel ? '' : 'no-insp'}">
    <aside class="facets" aria-label="Filtros">
      <div><div class="nav-label" style="padding-left:var(--space-xs)">Tipo documental</div>
        <div class="facet-list">${facet('Todos', works.length)}${types.map(([t, n]) => facet(t, n)).join('')}</div></div>
      <div><div class="nav-label" style="padding-left:var(--space-xs)">Compilações</div>
        <div class="facet-list">${comps.map(c => `<button class="facet" data-go="compilacao" data-comp="${c.id}" data-tab="obras"><span class="t">${esc(c.name)}</span><span class="num">${c.works.length}</span></button>`).join('')}</div></div>
    </aside>
    <section class="list-col" aria-label="Obras">
      <div class="list-tools">
        <label class="searchbox">${ms('search')}<span class="sr">Buscar obra</span><input class="input" id="q" placeholder="Buscar por título, autor ou ano" value="${esc(S.q)}" autocomplete="off"></label>
        <label class="sr" for="sort">Ordenar</label>
        <select class="select" id="sort" style="width:184px">
          <option value="recent" ${S.sort === 'recent' ? 'selected' : ''}>Mais recentes</option>
          <option value="title" ${S.sort === 'title' ? 'selected' : ''}>Título (A a Z)</option>
          <option value="year" ${S.sort === 'year' ? 'selected' : ''}>Ano de publicação</option>
        </select>
      </div>
      <div class="list-head" role="presentation"><span class="r">Ano</span><span>Obra</span><span class="r frag-col" title="Fragmentos">Frag.</span><span></span></div>
      <div class="rows" role="listbox" aria-label="Obras do acervo">
        ${list.length ? list.map(w => workRow(w, nested && w.parent && byId[w.parent])).join('') : `<div style="padding:var(--space-lg)"><div class="empty">${ms('search_off')}Nenhuma obra corresponde a “${esc(S.q)}”. Tente o sobrenome do autor ou o ano.</div></div>`}
      </div>
      <div class="list-foot"><span>${plural(list.length, 'obra', 'obras')}${S.type !== 'Todos' ? ` em ${esc(S.type)}` : ''}</span><span><kbd>↑</kbd> <kbd>↓</kbd> navegar · <kbd>⌘C</kbd> copiar referência</span></div>
    </section>
    ${S.sel ? inspector(byId[S.sel]) : ''}
  </div>`;
}
function workRow(w, isChild) {
  const n = (fragsByWork[w.id] || []).length;
  return `<div class="row ${isChild ? 'child' : ''}" role="option" tabindex="0" data-sel="${w.id}" aria-selected="${S.sel === w.id}">
    <span class="year num">${esc(w.year)}</span>
    <span class="titlecell" style="min-width:0"><div class="title">${esc(w.title)}</div><div class="by">${esc(authorsLine(w))}<span class="faint"> · ${esc(w.type)}</span></div></span>
    <span class="frag num r ${n ? '' : 'zero'}">${n || '·'}</span>
    <span class="quick"><button class="icon-btn" data-action="copy-ref" data-id="${w.id}" aria-label="Copiar referência ABNT" title="Copiar referência ABNT">${ms('content_copy')}</button></span>
  </div>`;
}
function inspector(w) {
  if (!w) return '';
  const fs = fragsByWork[w.id] || [];
  const parent = w.parent && byId[w.parent];
  const kids = works.filter(k => k.parent === w.id);
  const cs = compsOfWork(w.id);
  const dl = [['Local', w.place], ['Editora', w.publisher], ['Ano', w.year], ['Páginas', w.pages]].filter(([, v]) => v);
  return `<aside class="inspector" aria-label="Detalhes da obra">
    <div class="insp-head">
      <div class="insp-top"><span class="tag">${ms(TYPE_ICON[w.type] || 'description')}${esc(w.type)}</span><button class="icon-btn" data-action="close-insp" aria-label="Fechar painel">${ms('close')}</button></div>
      <h2 class="insp-title">${esc(w.title)}</h2>
      ${w.subtitle ? `<p class="insp-subtitle">${esc(w.subtitle)}</p>` : ''}
      <p class="insp-by">${esc(authorsLine(w))} <span class="num faint">· ${esc(w.year)}</span></p>
      <div class="insp-actions">
        <button class="btn sm" data-action="toast" data-msg="Edição abre o mesmo formulário de Nova obra, já preenchido">${ms('edit')}Editar</button>
        <button class="btn sm" data-action="new-fragment">${ms('format_quote')}Fragmento</button>
        <button class="btn sm ghost" data-action="delete-work" data-id="${w.id}" aria-label="Excluir obra">${ms('delete')}Excluir</button>
      </div>
    </div>
    <section class="insp-sec">
      <div class="ref-meta"><span class="tag">Referência ABNT</span><button class="btn sm" data-action="copy-ref" data-id="${w.id}">${ms('content_copy')}<span>Copiar</span></button></div>
      <div class="ref-box">${w.ref.length ? refHtml(w) : '<span class="faint">Este tipo ainda não tem formatador.</span>'}</div>
    </section>
    ${w.desc ? `<section class="insp-sec"><span class="tag">${ms('neurology')}Síntese</span><p class="prose">${esc(w.desc).replace(/\*([^*]+)\*/g, '<i>$1</i>')}</p></section>` : ''}
    ${dl.length ? `<section class="insp-sec"><span class="tag">Publicação</span><dl class="dl">${dl.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}${parent ? `<dt>Parte de</dt><dd><button class="link" data-sel="${parent.id}">${esc(parent.title)}</button></dd>` : ''}</dl></section>` : (parent ? `<section class="insp-sec"><span class="tag">Parte de</span><button class="link" data-sel="${parent.id}">${esc(parent.title)}</button></section>` : '')}
    ${kids.length ? `<section class="insp-sec"><span class="tag">Partes desta obra</span>${kids.map(k => `<button class="link" data-sel="${k.id}">${esc(k.title)}</button>`).join('')}</section>` : ''}
    <section class="insp-sec">
      <div class="ref-meta"><span class="tag">Fragmentos · ${fs.length}</span><button class="btn sm ghost" data-action="new-fragment">${ms('add')}Novo</button></div>
      ${fs.length ? fs.map(f => `<div class="mini-frag"><span class="cite-line"><b>${kindLabel(f.fragment_type)}</b><span class="num">${esc(f.location_value || 'sem localização')}</span></span><p class="clamp-3">${f.fragment_type === 'quote' ? qt(f.excerpt) : esc(f.excerpt)}</p></div>`).join('') : `<div class="empty">${ms('format_quote')}Nenhum fragmento ainda. Registre uma citação ou paráfrase desta obra.</div>`}
    </section>
    <section class="insp-sec">
      <span class="tag">Compilações</span>
      <div class="chips">${cs.map(c => `<button class="chip" data-go="compilacao" data-comp="${c.id}" data-tab="obras"><span class="ms">folder</span>${esc(c.name)}</button>`).join('')}<button class="chip" data-action="toast" data-msg="Adicionar a uma compilação">${ms('add')}Adicionar</button></div>
    </section>
  </aside>`;
}

/* ── fragmentos ─────────────────────────────────── */
function viewFragmentos() {
  crumbs([['Fragmentos']]);
  barActions(`<button class="btn primary" data-action="new-fragment">${ms('add')}Novo fragmento</button>`);
  const q = S.fq.trim().toLowerCase();
  const list = frags.filter(f => (S.fKind === 'all' || f.fragment_type === S.fKind) && (!q || (f.excerpt + ' ' + f.work_title + ' ' + f.citation_author).toLowerCase().includes(q)));
  const groups = [];
  list.forEach(f => { let g = groups.find(g => g.id === f.bib_res_id); if (!g) groups.push(g = { id: f.bib_res_id, items: [] }); g.items.push(f); });
  const nQ = frags.filter(f => f.fragment_type === 'quote').length;
  const seg = (k, l, n) => `<button data-fkind="${k}" aria-pressed="${S.fKind === k}">${l}<span class="num">${n}</span></button>`;
  return `<div class="page"><div class="frag-layout">
    <div>
      <div class="page-head" style="margin-bottom:var(--space-lg)"><div><h1 class="page-title">Fragmentos</h1><p class="page-sub">Citações e paráfrases das obras do seu acervo.</p></div></div>
      <div class="frag-tools">

/* ── nova obra ──────────────────────────────────── */
function openNewWork() {

function abntPreview(f) {
  if (!f.title.trim()) return null;
  const a = f.author.trim();
  let out = '';
  if (a) {
    const parts = a.split(/\s+/); const last = parts.pop().toUpperCase();
    const ini = parts.map(p => p[0].toUpperCase() + '.').join(' ');
    out += `${esc(last)}${ini ? ', ' + esc(ini) : ''} `;
    const t = f.keep ? f.title.trim() : f.title.trim().charAt(0).toUpperCase() + f.title.trim().slice(1).toLowerCase();
    out += `<b>${esc(t)}</b>`;
  } else {
    const words = f.title.trim().split(/\s+/);
    out += `${esc(words[0].toUpperCase())}${words.length > 1 ? ' ' + esc(words.slice(1).join(' ')) : ''}`;
  }
  if (f.subtitle.trim()) out += `: ${esc(f.subtitle.trim())}`;
  out += '.';
  if (f.edition.trim()) out += ` ${esc(f.edition.trim())}. ed.`;
  out += ` ${esc(f.place.trim() || '[S. l.]')}: ${esc(f.publisher.trim() || '[s. n.]')}, ${esc(f.year.trim() || '[s. d.]')}.`;
  if (f.pages.trim()) out += ` ${esc(f.pages.trim())} p.`;
  return out;
}

/* ── palette ────────────────────────────────────── */
function paletteResults(q) {
  q = q.trim().toLowerCase();
  const acts = [['add', 'Inserir nova obra', 'new-work'], ['format_quote', 'Registrar fragmento', 'new-fragment'], ['dark_mode', 'Alternar tema', 'toggle-theme']].filter(a => !q || a[1].toLowerCase().includes(q));
  const ws = works.filter(w => !q || [w.title, ...w.authors, w.year].join(' ').toLowerCase().includes(q)).slice(0, q ? 6 : 4);
  const fs = q ? frags.filter(f => f.excerpt.toLowerCase().includes(q)).slice(0, 4) : [];
  const items = [];
  if (ws.length) items.push({ g: 'Obras' }, ...ws.map(w => ({ icon: TYPE_ICON[w.type], t: w.title, s: authorsLine(w), serif: true, run: () => go('acervo', { sel: w.id, type: 'Todos', q: '' }) })));
  if (fs.length) items.push({ g: 'Fragmentos' }, ...fs.map(f => ({ icon: 'format_quote', t: f.excerpt, s: f.work_title, run: () => go('fragmentos', { fq: q }) })));
  if (acts.length) items.push({ g: 'Ações' }, ...acts.map(a => ({ icon: a[0], t: a[1], run: () => act(a[2]) })));
  return items;
}
function renderPalette() {
  const P = S.palette; const items = paletteResults(P.q); P.items = items.filter(i => !i.g);
  P.idx = Math.min(P.idx, Math.max(P.items.length - 1, 0));
  let k = -1;
  return `<div class="palette" data-action="close-overlay-bg"><div class="palette-box" role="dialog" aria-modal="true" aria-label="Buscar">
    <div class="palette-input">${ms('search')}<input id="pq" value="${esc(P.q)}" placeholder="Buscar obras, fragmentos e ações" autocomplete="off" aria-controls="presults"></div>
    <div class="palette-results" id="presults" role="listbox">${items.length ? items.map(i => i.g ? `<div class="p-group">${i.g}</div>` : (k++, `<button class="p-item" role="option" data-pidx="${k}" aria-selected="${k === P.idx}">${ms(i.icon)}<span class="t ${i.serif ? 'serif' : ''}">${esc(i.t)}</span>${i.s ? `<span class="s">${esc(i.s)}</span>` : ''}</button>`)).join('') : `<div class="empty" style="margin:var(--space-xs)">Nada encontrado para “${esc(P.q)}”.</div>`}</div>
    <div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span><kbd>esc</kbd> fechar</span></div>
  </div></div>`;
}

let spyObs;
function spy() {
  spyObs?.disconnect();
  const root = $('#writing'); if (!root) return;
  spyObs = new IntersectionObserver((es) => {
    const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (!vis) return; S.idea = +vis.target.id.replace('idea-', '');
    document.querySelectorAll('.ro-item[data-idea]').forEach(b => b.setAttribute('aria-current', String(+b.dataset.idea === S.idea)));
  }, { root, rootMargin: '0px 0px -60% 0px' });
  root.querySelectorAll('.idea').forEach(el => spyObs.observe(el));
}
function renderOverlay() {
  $('#overlay').innerHTML = S.form ? renderNewWork() : S.palette ? renderPalette() : '';
}
function refreshForm() {
  const prev = abntPreview(S.form); const el = $('#nw-prev');
  el.innerHTML = prev || 'A referência aparece aqui enquanto você preenche.'; el.classList.toggle('placeholder', !prev);
  const valid = S.form.title.trim() && S.form.year.trim(); const b = $('#nw-save');
  b.disabled = !valid; b.title = valid ? '' : 'Preencha título e ano';

let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  $('#toast-root').innerHTML = `<div class="toast" role="status">${esc(msg)}${undo ? '<button data-action="undo">Desfazer</button>' : ''}</div>`;
  toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; }, undo ? 6000 : 3200);
}
function flash(btn) {
  if (!btn) return;
  const icon = btn.querySelector('.ms'); const label = btn.querySelector('span:not(.ms)');
  const old = [icon?.textContent, label?.textContent];
  btn.dataset.state = 'success'; if (icon) icon.textContent = 'check'; if (label) label.textContent = 'Copiada';
  setTimeout(() => { delete btn.dataset.state; if (icon) icon.textContent = old[0]; if (label) label.textContent = old[1]; }, 1600);
}
const copy = (t) => { try { navigator.clipboard?.writeText(t); } catch (e) {} };
let lastDeleted = null;
function act(a, el) {
  switch (a) {
    case 'new-work': S.palette = null; openNewWork(); break;
    case 'new-fragment': S.palette = null; renderOverlay(); toast('Novo fragmento: escolha a obra, o tipo e a localização'); break;
    case 'toggle-theme': S.palette = null; setTheme(S.theme === 'dark' ? 'light' : 'dark'); break;
    case 'palette': S.palette = { q: '', idx: 0 }; renderOverlay(); setTimeout(() => $('#pq')?.focus(), 20); break;
    case 'close-overlay': S.form = null; S.palette = null; renderOverlay(); break;
    case 'copy-ref': { const w = byId[+el.dataset.id]; copy(refPlain(w)); flash(el); break; }
    case 'copy-frag': { const f = D.fragments.find(x => x.id === +el.dataset.id); copy(`${/^[“"]/.test(f.excerpt.trim()) ? f.excerpt : '“' + f.excerpt + '”'} ${shortCite(f)}`); flash(el); break; }
    case 'copy-skeleton': copy('esqueleto'); flash(el); break;
    case 'close-insp': S.sel = null; render(); break;
    case 'delete-work': { const id = +el.dataset.id; const i = works.findIndex(w => w.id === id); lastDeleted = { w: works.splice(i, 1)[0], i }; delete byId[id]; S.sel = works[Math.min(i, works.length - 1)]?.id; render(); toast(`“${lastDeleted.w.title}” removida do acervo`, true); break; }
    case 'undo': if (lastDeleted) { works.splice(lastDeleted.i, 0, lastDeleted.w); byId[lastDeleted.w.id] = lastDeleted.w; S.sel = lastDeleted.w.id; lastDeleted = null; render(); } $('#toast-root').innerHTML = ''; break;
    case 'save-work': { el.dataset.state = 'loading'; el.innerHTML = `${ms('progress_activity')}Salvando`; setTimeout(() => { const t = S.form.title; S.form = null; renderOverlay(); toast(`“${t}” salva no acervo`); }, 700); break; }
    case 'toast': toast(el.dataset.msg, !!el.dataset.undo); break;
  }
}
function setTheme(t) { S.theme = t; try { localStorage.setItem('hup-theme', t); } catch (e) {} render(); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action],[data-go],[data-sel],[data-type],[data-fkind],[data-tab],[data-idea],[data-jump],[data-theme-set],[data-ftype],[data-pidx]');
  if (!t) return;
  if (t.dataset.action === 'close-overlay-bg') { if (e.target === t) act('close-overlay'); return; }
  if (t.dataset.action && !(t.matches('.row') )) { e.stopPropagation(); return act(t.dataset.action, t); }
  if (t.dataset.themeSet) return setTheme(t.dataset.themeSet);
  if (t.dataset.pidx) { const it = S.palette.items[+t.dataset.pidx]; S.palette = null; renderOverlay(); return it.run(); }
  if (t.dataset.ftype) { S.form.type = t.dataset.ftype; renderOverlay(); return; }
  if (t.dataset.go) { const ex = {}; if (t.dataset.comp) ex.comp = +t.dataset.comp; if (t.dataset.tab) ex.tab = t.dataset.tab; if (t.dataset.type) Object.assign(ex, { type: t.dataset.type, q: '' }); if (t.dataset.sel) ex.sel = +t.dataset.sel; return go(t.dataset.go, ex); }
  if (t.dataset.type) { S.type = t.dataset.type; S.view = 'acervo'; return render(); }
  if (t.dataset.sel) { S.sel = +t.dataset.sel; if (S.view !== 'acervo') S.view = 'acervo'; render(); $(`.row[data-sel="${S.sel}"]`)?.focus({ preventScroll: false }); return; }
  if (t.dataset.fkind) { S.fKind = t.dataset.fkind; return render(); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; return render(); }
  if (t.dataset.idea) { S.idea = +t.dataset.idea; document.querySelectorAll('.ro-item[data-idea]').forEach(b => b.setAttribute('aria-current', String(+b.dataset.idea === S.idea))); $(`#idea-${S.idea}`)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
  if (t.dataset.jump) { $('#' + t.dataset.jump)?.scrollIntoView({ block: 'start' }); return; }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === 'fq') { S.fq = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#fq'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.dataset.f && S.form) { S.form[e.target.dataset.f] = e.target.value; refreshForm(); }
  if (e.target.id === 'pq') { S.palette.q = e.target.value; S.palette.idx = 0; const pos = e.target.selectionStart; renderOverlay(); const i = $('#pq'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
  if (e.target.dataset.fcheck && S.form) { S.form[e.target.dataset.fcheck] = e.target.checked; refreshForm(); }
});
document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); return act(S.palette ? 'close-overlay' : 'palette'); }
  if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); return act('new-work'); }
  if (e.key === 'Escape' && (S.palette || S.form)) { e.preventDefault(); return act('close-overlay'); }
  if (S.palette && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    e.preventDefault(); const P = S.palette;
    if (e.key === 'Enter') { const it = P.items[P.idx]; if (it) { S.palette = null; renderOverlay(); it.run(); } return; }
    P.idx = Math.max(0, Math.min(P.items.length - 1, P.idx + (e.key === 'ArrowDown' ? 1 : -1)));
    document.querySelectorAll('.p-item').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.pidx === P.idx)));
    $(`.p-item[data-pidx="${P.idx}"]`)?.scrollIntoView({ block: 'nearest' }); return;
  }
  const row = e.target.closest?.('.row');
  if (row && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const sib = e.key === 'ArrowDown' ? row.nextElementSibling : row.previousElementSibling; if (sib?.dataset.sel) { S.sel = +sib.dataset.sel; render(); $(`.row[data-sel="${S.sel}"]`)?.focus(); } }
  if (row && e.key === 'Enter') { S.sel = +row.dataset.sel; render(); $(`.row[data-sel="${S.sel}"]`)?.focus(); }
  if (row && mod && e.key.toLowerCase() === 'c') { copy(refPlain(byId[+row.dataset.sel])); toast('Referência copiada'); }
});

render();
window.__hup = { S, go, render, act, setTheme };
})();
</script>
